<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>مغامرة المربع السريع - مكتبة الألعاب</title>
<style>
:root {
  --primary: #6200EE;
  --primary-dark: #3700B3;
  --accent: #03DAC6;
  --highlight: #FF0266;
  --control: #B0BEC5;
  --bg: #121212;
  --surface: #1E1E1E;
  --surface-light: #2D2D2D;
  --text: #FFFFFF;
  --text-secondary: #B3B3B3;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
}

body {
  background-color: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  padding-top: env(safe-area-inset-top);
  padding-bottom: env(safe-area-inset-bottom);
  display: flex;
  flex-direction: column;
  height: 100vh;
  height: calc(100vh - env(safe-area-inset-top) - env(safe-area-inset-bottom));
  overflow: hidden;
}

header {
  background-color: var(--surface);
  height: 56px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 16px;
  border-bottom: 1px solid var(--surface-light);
  flex-shrink: 0;
  z-index: 10;
}

.header-title {
  font-size: 18px;
  font-weight: bold;
}

.icon-btn {
  background: none;
  border: none;
  width: 40px;
  height: 40px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--text);
  cursor: pointer;
}

.icon-btn:active {
  background-color: var(--surface-light);
}

.icon-btn svg {
  width: 24px;
  height: 24px;
  fill: currentColor;
}

.main-content {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 16px;
  position: relative;
  overflow: hidden;
}

.game-container {
  width: 100%;
  max-width: 400px;
  aspect-ratio: 3 / 4;
  background-color: var(--surface);
  border-radius: 16px;
  overflow: hidden;
  position: relative;
  box-shadow: 0 8px 24px rgba(0,0,0,0.5);
  display: flex;
  flex-direction: column;
  border: 2px solid var(--surface-light);
}

canvas {
  display: block;
  width: 100%;
  height: 100%;
  background: linear-gradient(to bottom, #1a1a2e, #16213e);
}

.overlay-screen {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(18, 18, 18, 0.85);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 24px;
  text-align: center;
  z-index: 5;
  transition: opacity 0.3s ease;
}

.overlay-screen.hidden {
  opacity: 0;
  pointer-events: none;
}

.game-title {
  font-size: 24px;
  font-weight: bold;
  margin-bottom: 8px;
  color: var(--accent);
}

.game-desc {
  font-size: 14px;
  color: var(--text-secondary);
  margin-bottom: 24px;
  line-height: 1.5;
}

.btn {
  background-color: var(--primary);
  color: white;
  border: none;
  padding: 12px 32px;
  border-radius: 24px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
  box-shadow: 0 4px 12px rgba(98, 0, 238, 0.4);
  transition: transform 0.1s, background-color 0.1s;
  min-height: 48px;
  min-width: 140px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.btn:active {
  transform: scale(0.96);
  background-color: var(--primary-dark);
}

.hud {
  position: absolute;
  top: 16px;
  left: 16px;
  right: 16px;
  display: flex;
  justify-content: space-between;
  font-size: 18px;
  font-weight: bold;
  z-index: 2;
  pointer-events: none;
  text-shadow: 0 2px 4px rgba(0,0,0,0.8);
}

.controls-hint {
  margin-top: 16px;
  font-size: 13px;
  color: var(--control);
  text-align: center;
}

.bottom-nav {
  height: 60px;
  background-color: var(--surface);
  display: flex;
  justify-content: space-around;
  align-items: center;
  border-top: 1px solid var(--surface-light);
  flex-shrink: 0;
}

.nav-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-decoration: none;
  color: var(--text-secondary);
  font-size: 11px;
  width: 100%;
  height: 100%;
}

.nav-item.active {
  color: var(--accent);
}

.nav-item svg {
  width: 24px;
  height: 24px;
  fill: currentColor;
  margin-bottom: 2px;
}
</style>
<style id="rt-native">html,body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}input,textarea,select,[contenteditable],.rt-selectable,.rt-selectable *{-webkit-user-select:text;user-select:text}img,a{-webkit-user-drag:none}a,button,[role=button]{outline:none}</style>
</head>
<body>

<header>
  <a href="home.html" class="icon-btn" aria-label="الرجوع">
    <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
  </a>
  <h1 class="header-title">مغامرة المربع السريع</h1>
  <button class="icon-btn" id="fav-btn" aria-label="إضافة للمفضلة">
    <svg id="fav-icon" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
  </button>
</header>

<main class="main-content">
  <div class="game-container" id="game-container">
    <div class="hud">
      <span id="score-disp">النقاط: 0</span>
      <span id="high-score-disp">الأعلى: 0</span>
    </div>
    
    <canvas id="gameCanvas"></canvas>

    <div class="overlay-screen" id="start-screen">
      <div class="game-title">المربع السريع</div>
      <div class="game-desc">اقفز لتفادي العقبات الحمراء واجمع النقاط بالبقاء على قيد الحياة لأطول فترة ممكنة.</div>
      <button class="btn" id="start-btn">ابدأ اللعب</button>
    </div>

    <div class="overlay-screen hidden" id="gameover-screen">
      <div class="game-title" style="color: var(--highlight);">انتهت اللعبة</div>
      <div class="game-desc" id="final-score-text">لقد حصلت على: 0 نقطة</div>
      <button class="btn" id="restart-btn">العب مجدداً</button>
    </div>
  </div>
  <div class="controls-hint">انقر في أي مكان على الشاشة أو المس لوحة اللعب للقفز</div>
</main>

<nav class="bottom-nav">
  <a href="home.html" class="nav-item">
    <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
    الرئيسية
  </a>
  <a href="favorites.html" class="nav-item">
    <svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
    المفضلة
  </a>
</nav>

<script>
(function() {
  var gameId = "game-2";
  var favBtn = document.getElementById("fav-btn");
  var favIcon = document.getElementById("fav-icon");

  function checkFavorite() {
    try {
      var favs = JSON.parse(localStorage.getItem("game_favorites") || "[]");
      var isFav = favs.indexOf(gameId) !== -1;
      if (isFav) {
        favIcon.style.fill = "var(--highlight)";
      } else {
        favIcon.style.fill = "currentColor";
      }
    } catch(e) {}
  }

  favBtn.addEventListener("click", function() {
    try {
      var favs = JSON.parse(localStorage.getItem("game_favorites") || "[]");
      var idx = favs.indexOf(gameId);
      if (idx !== -1) {
        favs.splice(idx, 1);
        favIcon.style.fill = "currentColor";
      } else {
        favs.push(gameId);
        favIcon.style.fill = "var(--highlight)";
      }
      localStorage.setItem("game_favorites", JSON.stringify(favs));
    } catch(e) {}
  });

  checkFavorite();

  // Audio Context for Sound Effects
  var audioCtx = null;
  function getAudioContext() {
    if (!audioCtx) {
      var AudioContext = window.AudioContext || window.webkitAudioContext;
      if (AudioContext) {
        audioCtx = new AudioContext();
      }
    }
    return audioCtx;
  }

  function playSound(type) {
    try {
      var ctx = getAudioContext();
      if (!ctx) return;
      if (ctx.state === 'suspended') {
        ctx.resume();
      }
      var osc = ctx.createOscillator();
      var gain = ctx.createGain();
      osc.connect(gain);
      gain.connect(ctx.destination);

      var now = ctx.currentTime;
      if (type === 'jump') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(150, now);
        osc.frequency.exponentialRampToValueAtTime(400, now + 0.15);
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.15);
        osc.start(now);
        osc.stop(now + 0.15);
      } else if (type === 'score') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(400, now);
        osc.frequency.setValueAtTime(600, now + 0.08);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.16);
        osc.start(now);
        osc.stop(now + 0.16);
      } else if (type === 'gameover') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(200, now);
        osc.frequency.linearRampToValueAtTime(80, now + 0.4);
        gain.gain.setValueAtTime(0.4, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.4);
        osc.start(now);
        osc.stop(now + 0.4);
      }
    } catch(e) {}
  }

  // Canvas Game Engine
  var canvas = document.getElementById("gameCanvas");
  var ctx = canvas.getContext("2d");
  var startScreen = document.getElementById("start-screen");
  var gameoverScreen = document.getElementById("gameover-screen");
  var startBtn = document.getElementById("start-btn");
  var restartBtn = document.getElementById("restart-btn");
  var scoreDisp = document.getElementById("score-disp");
  var highScoreDisp = document.getElementById("high-score-disp");
  var finalScoreText = document.getElementById("final-score-text");
  var container = document.getElementById("game-container");

  function resizeCanvas() {
    canvas.width = container.clientWidth;
    canvas.height = container.clientHeight;
  }
  window.addEventListener("resize", resizeCanvas);
  resizeCanvas();

  var gameState = "START"; // START, PLAYING, GAMEOVER
  var score = 0;
  var highScore = 0;
  try {
    highScore = parseInt(localStorage.getItem("game2d_highscore") || "0", 10);
  } catch(e) {}
  highScoreDisp.textContent = "الأعلى: " + highScore;

  var gravity = 0.6;
  var player = {
    x: 50,
    y: 0,
    w: 30,
    h: 30,
    vy: 0,
    jumpForce: -11,
    grounded: false
  };

  var obstacles = [];
  var obstacleTimer = 0;
  var obstacleInterval = 90;
  var gameSpeed = 4;

  function resetGame() {
    score = 0;
    scoreDisp.textContent = "النقاط: 0";
    obstacles = [];
    obstacleTimer = 0;
    gameSpeed = 4;
    player.y = canvas.height - 100;
    player.vy = 0;
    player.grounded = false;
  }

  function jump() {
    if (gameState === "PLAYING" && player.grounded) {
      player.vy = player.jumpForce;
      player.grounded = false;
      playSound('jump');
    }
  }

  container.addEventListener("click", function(e) {
    if (gameState === "PLAYING") {
      jump();
    }
  });

  window.addEventListener("keydown", function(e) {
    if (e.code === "Space" || e.code === "ArrowUp") {
      if (gameState === "PLAYING") {
        jump();
        e.preventDefault();
      }
    }
  });

  startBtn.addEventListener("click", function(e) {
    e.stopPropagation();
    startScreen.classList.add("hidden");
    gameState = "PLAYING";
    resetGame();
    requestAnimationFrame(update);
  });

  restartBtn.addEventListener("click", function(e) {
    e.stopPropagation();
    gameoverScreen.classList.add("hidden");
    gameState = "PLAYING";
    resetGame();
    requestAnimationFrame(update);
  });

  function update() {
    if (gameState !== "PLAYING") return;

    // Physics
    player.vy += gravity;
    player.y += player.vy;

    var groundLevel = canvas.height - 60;
    if (player.y + player.h >= groundLevel) {
      player.y = groundLevel - player.h;
      player.vy = 0;
      player.grounded = true;
    }

    // Obstacles spawn
    obstacleTimer++;
    if (obstacleTimer >= obstacleInterval) {
      obstacleTimer = 0;
      var obsHeight = 30 + Math.floor(Math.random() * 40);
      obstacles.push({
        x: canvas.width,
        y: groundLevel - obsHeight,
        w: 25,
        h: obsHeight,
        passed: false
      });
      // Randomize interval slightly
      obstacleInterval = 70 + Math.floor(Math.random() * 50);
    }

    // Move obstacles
    for (var i = obstacles.length - 1; i >= 0; i--) {
      var obs = obstacles[i];
      obs.x -= gameSpeed;

      // Score check
      if (!obs.passed && obs.x + obs.w < player.x) {
        obs.passed = true;
        score += 10;
        scoreDisp.textContent = "النقاط: " + score;
        playSound('score');
        // Increase speed gradually
        if (score % 50 === 0) {
          gameSpeed += 0.5;
        }
      }

      // Collision detection (AABB)
      if (
        player.x < obs.x + obs.w &&
        player.x + player.w > obs.x &&
        player.y < obs.y + obs.h &&
        player.y + player.h > obs.y
      ) {
        // Game Over
        gameState = "GAMEOVER";
        playSound('gameover');
        if (score > highScore) {
          highScore = score;
          highScoreDisp.textContent = "الأعلى: " + highScore;
          try {
            localStorage.setItem("game2d_highscore", highScore.toString());
          } catch(e) {}
        }
        finalScoreText.textContent = "لقد حصلت على: " + score + " نقطة";
        gameoverScreen.classList.remove("hidden");
        return;
      }

      // Remove offscreen
      if (obs.x + obs.w < 0) {
        obstacles.splice(i, 1);
      }
    }

    draw();
    requestAnimationFrame(update);
  }

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    var groundLevel = canvas.height - 60;

    // Draw background grid lines (retro effect)
    ctx.strokeStyle = "rgba(255,255,255,0.05)";
    ctx.lineWidth = 1;
    for (var x = 0; x < canvas.width; x += 40) {
      ctx.beginPath();
      ctx.moveTo(x, 0);
      ctx.lineTo(x, groundLevel);
      ctx.stroke();
    }

    // Draw Ground
    ctx.fillStyle = "#1e293b";
    ctx.fillRect(0, groundLevel, canvas.width, canvas.height - groundLevel);
    ctx.fillStyle = "#03DAC6";
    ctx.fillRect(0, groundLevel, canvas.width, 3);

    // Draw Player
    ctx.fillStyle = "#03DAC6";
    ctx.fillRect(player.x, player.y, player.w, player.h);
    // Player inner detail
    ctx.fillStyle = "#121212";
    ctx.fillRect(player.x + 6, player.y + 6, player.w - 12, player.h - 12);

    // Draw Obstacles
    for (var i = 0; i < obstacles.length; i++) {
      var obs = obstacles[i];
      ctx.fillStyle = "#FF0266";
      ctx.fillRect(obs.x, obs.y, obs.w, obs.h);
      // Obstacle highlight
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(obs.x + 4, obs.y + 4, obs.w - 8, 4);
    }
  }

  // Initial draw before start
  draw();

})();
</script>
</body>
</html>
