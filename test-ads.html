<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>اختبار الإعلانات</title>
<style>
:root{--bg:#0f172a;--card:#1e293b;--ac:#38bdf8;--ok:#22c55e;--bad:#ef4444;--tx:#f1f5f9}
*{box-sizing:border-box;margin:0}
body{font-family:system-ui,sans-serif;background:var(--bg);color:var(--tx);padding:16px;font-size:16px;line-height:1.6}
h1{font-size:22px;margin:8px 0 14px}
h2{font-size:18px;margin-bottom:6px}
.card{background:var(--card);border-radius:14px;padding:16px;margin-bottom:14px}
button{width:100%;min-height:48px;border:0;border-radius:12px;background:var(--ac);color:#04283a;font-size:16px;font-weight:700;margin-top:8px;font-family:inherit}
button.sec{background:#334155;color:var(--tx)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
#log{background:#020617;border-radius:10px;padding:10px;font-family:monospace;font-size:13px;direction:ltr;text-align:left;white-space:pre-wrap;max-height:240px;overflow:auto}
a.back{display:inline-block;color:var(--ac);margin-bottom:12px;text-decoration:none}
.ok{color:var(--ok)}.no{color:var(--bad)}
.note{color:#94a3b8;font-size:14px}
</style>
</head>
<body>
<a class="back" href="home.html">← مركز الاختبار</a>
<h1>📺 اختبار الإعلانات</h1>
<p class="note" style="margin-bottom:12px">تظهر فقط الشبكات المفعّلة في تطبيقك. الإعلانات البينية والمكافأة تُحمَّل مسبقاً؛ إن لم تكن جاهزة تكون النتيجة false.</p>

<div id="nets"></div>

<div class="card">
<h2>مكافأة بالتسلسل (Unity ← AdMob ← Facebook)</h2>
<p class="note">يجرّب كل شبكة بالترتيب حتى تنجح إحداها.</p>
<button id="chain">جرّب مكافأة بالتسلسل</button>
</div>

<div class="card">
<h2>السجل</h2>
<div id="log"></div>
<button class="sec" id="clr">مسح السجل</button>
</div>

<script>
function log(m){var l=document.getElementById('log');l.textContent+=m+'\n';l.scrollTop=l.scrollHeight}
var NETS=[['AdMob','RosTrickAds'],['Unity Ads','RosTrickUnityAds'],['Facebook Ads','RosTrickFbAds']];
var box=document.getElementById('nets');
NETS.forEach(function(n){
  var obj=window[n[1]];
  var d=document.createElement('div');d.className='card';
  d.innerHTML='<h2>'+n[0]+' <span class="'+(obj?'ok':'no')+'">'+(obj?'✅':'❌ غير متاح')+'</span></h2>'
   +'<div class="grid"><button data-a="bt">بانر أسفل</button><button data-a="btt">بانر أعلى</button></div>'
   +'<button class="sec" data-a="bh">إخفاء البانر</button>'
   +'<button data-a="i">إعلان بيني</button>'
   +'<button data-a="r">إعلان مكافأة</button>'
   +'<button class="sec" data-a="rd">هل الجاهزية؟ (isReady)</button>';
  d.addEventListener('click',async function(e){
    var a=e.target.getAttribute&&e.target.getAttribute('data-a');if(!a)return;
    if(!obj){log(n[0]+': غير متاح');return}
    try{
      if(a==='bt'){obj.showBanner('bottom');log(n[0]+': بانر أسفل')}
      else if(a==='btt'){obj.showBanner('top');log(n[0]+': بانر أعلى')}
      else if(a==='bh'){obj.hideBanner();log(n[0]+': إخفاء البانر')}
      else if(a==='i'){log(n[0]+' بيني ← '+await obj.showInterstitial())}
      else if(a==='r'){var ok=await obj.showRewarded();log(n[0]+' مكافأة ← '+ok+(ok?' (امنح المكافأة الآن 🎁)':''))}
      else if(a==='rd'){log(n[0]+' جاهز؟ مكافأة='+obj.isReady('rewarded')+' / بيني='+obj.isReady('interstitial'))}
    }catch(err){log(n[0]+' خطأ: '+err.message)}
  });
  box.appendChild(d);
});
document.getElementById('chain').onclick=async function(){
  var order=[['Unity','RosTrickUnityAds'],['AdMob','RosTrickAds'],['Facebook','RosTrickFbAds']];
  for(var i=0;i<order.length;i++){
    var o=window[order[i][1]];
    if(!o){log(order[i][0]+': غير متاح، التالي...');continue}
    try{
      if(await o.showRewarded()){log('✅ نجحت المكافأة عبر '+order[i][0]);return}
      log(order[i][0]+': غير جاهز، التالي...');
    }catch(e){log(order[i][0]+' خطأ: '+e.message)}
  }
  log('❌ لم تتوفر أي مكافأة');
};
document.getElementById('clr').onclick=function(){document.getElementById('log').textContent=''};
</script>
</body>
</html>
