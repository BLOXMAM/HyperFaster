<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>اختبار التحميل عند الطلب</title>
<style>
:root{--bg:#0f172a;--card:#1e293b;--ac:#38bdf8;--ok:#22c55e;--bad:#ef4444;--tx:#f1f5f9}
*{box-sizing:border-box;margin:0}
body{font-family:system-ui,sans-serif;background:var(--bg);color:var(--tx);padding:16px;font-size:16px;line-height:1.6}
h1{font-size:22px;margin:8px 0 14px}
h2{font-size:18px;margin-bottom:6px}
.card{background:var(--card);border-radius:14px;padding:16px;margin-bottom:14px}
button{width:100%;min-height:48px;border:0;border-radius:12px;background:var(--ac);color:#04283a;font-size:16px;font-weight:700;margin-top:8px;font-family:inherit}
button:disabled{opacity:.5}
button.sec{background:#334155;color:var(--tx)}
input,textarea{width:100%;border-radius:10px;border:1px solid #475569;background:#0f172a;color:var(--tx);padding:8px 12px;font-size:16px;margin-top:6px;font-family:monospace;direction:ltr;text-align:left}
input{min-height:46px}
#log{background:#020617;border-radius:10px;padding:10px;font-family:monospace;font-size:13px;direction:ltr;text-align:left;white-space:pre-wrap;max-height:240px;overflow:auto}
a.back{display:inline-block;color:var(--ac);margin-bottom:12px;text-decoration:none}
label{font-size:14px;color:#94a3b8}
.note{color:#94a3b8;font-size:14px}
</style>
</head>
<body>
<a class="back" href="home.html">← مركز الاختبار</a>
<h1>📥 اختبار التحميل عند الطلب</h1>

<div class="card">
<h2>1) صفحة واحدة</h2>
<p class="note">أضف الصفحة <b>test-manual-sample.html</b> (الملحقة) في اللوحة وعيّنها «يدوية» (manual) ثم جرّب هنا.</p>
<label>اسم الصفحة اليدوية</label>
<input id="p1" value="test-manual-sample.html">
<button id="b1">...</button>
</div>

<div class="card">
<h2>2) عدة ملفات بضغطة واحدة</h2>
<p class="note">اكتب مسار كل ملف في سطر، بالترتيب. السطر الأول يُفتح في النهاية (الصفحة الرئيسية).</p>
<textarea id="list" rows="5">test-manual-sample.html</textarea>
<button id="b2">...</button>
<div id="prog" class="note" style="margin-top:8px"></div>
</div>

<div class="card">
<h2>السجل</h2>
<div id="log"></div>
</div>

<script>
function log(m){var l=document.getElementById('log');l.textContent+=m+'\n';l.scrollTop=l.scrollHeight}
var RP=window.RosTrickPages;
log('RosTrickPages: '+(RP?'متاح ✅':'غير متاح ❌ (خارج التطبيق)'));

/* ---- صفحة واحدة ---- */
var b1=document.getElementById('b1'),p1=document.getElementById('p1');
function setupOne(){
  var path=p1.value.trim();
  b1.disabled=false;
  if(RP&&RP.isDownloaded(path)){
    b1.textContent='فتح الصفحة';
    b1.onclick=function(){RP.openPage(path)};
  }else{
    b1.textContent='تحميل الصفحة';
    b1.onclick=async function(){
      if(!RP){alert('يعمل فقط داخل تطبيق RosTrick');return}
      b1.disabled=true;log('تحميل '+path+' ...');
      var ok=await RP.download(path);
      b1.disabled=false;log('النتيجة: '+ok);
      if(ok)setupOne();else alert('فشل التحميل، تحقق من الاتصال واسم الصفحة');
    };
  }
}
p1.oninput=setupOne;setupOne();

/* ---- عدة ملفات ---- */
var b2=document.getElementById('b2'),prog=document.getElementById('prog');
function files(){return document.getElementById('list').value.split('\n').map(function(s){return s.trim()}).filter(Boolean)}
function allDone(){var f=files();return RP&&f.length&&f.every(function(p){return RP.isDownloaded(p)})}
function setupMany(){
  b2.disabled=false;
  if(allDone()){
    b2.textContent='فتح';
    b2.onclick=function(){RP.openPage(files()[0])};
  }else{
    b2.textContent='تحميل الكل';
    b2.onclick=downloadAll;
  }
}
async function downloadAll(){
  if(!RP){alert('يعمل فقط داخل تطبيق RosTrick');return}
  var f=files();b2.disabled=true;
  for(var i=0;i<f.length;i++){
    prog.textContent='جارٍ التحميل '+(i+1)+'/'+f.length+' ...';
    if(RP.isDownloaded(f[i]))continue;
    var ok=await RP.download(f[i]);
    if(!ok){b2.disabled=false;prog.textContent='فشل: '+f[i]+' — أعد المحاولة (سيكمل من حيث توقف)';log('فشل '+f[i]);return}
    log('تم: '+f[i]);
  }
  prog.textContent='اكتمل ✅';setupMany();
}
document.getElementById('list').oninput=setupMany;
setupMany();
</script>
</body>
</html>
