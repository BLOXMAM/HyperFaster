<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>اختبار المشاركة</title>
<style>
:root{--bg:#0f172a;--card:#1e293b;--ac:#38bdf8;--ok:#22c55e;--bad:#ef4444;--tx:#f1f5f9}
*{box-sizing:border-box;margin:0}
body{font-family:system-ui,sans-serif;background:var(--bg);color:var(--tx);padding:16px;font-size:16px;line-height:1.6}
h1{font-size:22px;margin:8px 0 14px}
.card{background:var(--card);border-radius:14px;padding:16px;margin-bottom:14px}
button{width:100%;min-height:48px;border:0;border-radius:12px;background:var(--ac);color:#04283a;font-size:16px;font-weight:700;margin-top:8px;font-family:inherit}
button.sec{background:#334155;color:var(--tx)}
input,textarea{width:100%;min-height:46px;border-radius:10px;border:1px solid #475569;background:#0f172a;color:var(--tx);padding:8px 12px;font-size:16px;margin-top:6px;font-family:inherit}
#log{background:#020617;border-radius:10px;padding:10px;font-family:monospace;font-size:13px;direction:ltr;text-align:left;white-space:pre-wrap;max-height:220px;overflow:auto;margin-top:10px}
a.back{display:inline-block;color:var(--ac);margin-bottom:12px;text-decoration:none}
label{font-size:14px;color:#94a3b8}
</style>
</head>
<body>
<a class="back" href="home.html">← مركز الاختبار</a>
<h1>📤 اختبار المشاركة</h1>

<div class="card">
<label>العنوان (title)</label>
<input id="t" value="مشاركة">
<label>النص (text)</label>
<textarea id="x" rows="3">جرّب تطبيقي الجديد!</textarea>
<label>الرابط (url) — اختياري</label>
<input id="u" value="https://example.com" dir="ltr">
<button id="go">مشاركة الآن</button>
<button class="sec" id="webshare">مشاركة عبر المتصفح (navigator.share) للمقارنة</button>
<div id="log"></div>
</div>

<script>
function log(m){var l=document.getElementById('log');l.textContent+=m+'\n';l.scrollTop=l.scrollHeight}
log('RosTrickShare: '+(window.RosTrickShare?'متاح ✅':'غير متاح ❌ (خارج التطبيق)'));
document.getElementById('go').onclick=function(){
  try{
    if(!window.RosTrickShare){log('غير متاح خارج تطبيق RosTrick');return}
    var o={text:document.getElementById('x').value,title:document.getElementById('t').value};
    var u=document.getElementById('u').value.trim();
    if(u)o.url=u;
    var r=RosTrickShare.share(o);
    log('تم استدعاء share → '+r);
  }catch(e){log('خطأ: '+e.message)}
};
document.getElementById('webshare').onclick=async function(){
  try{
    if(!navigator.share){log('navigator.share غير مدعوم هنا');return}
    await navigator.share({title:document.getElementById('t').value,text:document.getElementById('x').value,url:document.getElementById('u').value});
    log('تمت المشاركة عبر المتصفح');
  }catch(e){log('أُلغيت/فشلت: '+e.message)}
};
</script>
</body>
</html>
