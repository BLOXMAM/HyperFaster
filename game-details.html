<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تفاصيل اللعبة - مكتبة الألعاب المتواضعة</title>
<style>
  :root {
    --primary: #6200EE;
    --primary-dark: #3700B3;
    --accent: #03DAC6;
    --highlight: #FF0266;
    --control: #B0BEC5;
    --bg: #121212;
    --surface: #1E1E1E;
    --text: #E0E0E0;
    --text-muted: #9E9E9E;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Tahoma, Arial, sans-serif;
  }

  body {
    background-color: var(--bg);
    color: var(--text);
    padding-bottom: 70px;
  }

  /* Header */
  header {
    background-color: var(--surface);
    padding: 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid #333;
    position: sticky;
    top: 0;
    z-index: 10;
  }

  h1 {
    font-size: 1.2rem;
    color: var(--accent);
  }

  .back-btn {
    background: none;
    border: none;
    color: var(--text);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 44px;
    height: 44px;
    border-radius: 50%;
  }

  .back-btn:active {
    background-color: rgba(255,255,255,0.1);
  }

  svg {
    width: 24px;
    height: 24px;
    fill: currentColor;
  }

  /* Main Container */
  .container {
    padding: 16px;
    max-width: 600px;
    margin: 0 auto;
  }

  /* Hero Banner */
  .game-banner {
    width: 100%;
    height: 220px;
    background-color: #2c2c2c;
    border-radius: 12px;
    overflow: hidden;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 16px;
    border: 1px solid #333;
  }

  .game-banner svg.large-icon {
    width: 80px;
    height: 80px;
    fill: var(--accent);
    opacity: 0.8;
  }

  .game-header-info {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 12px;
  }

  .game-title {
    font-size: 1.5rem;
    color: #fff;
    margin-bottom: 4px;
  }

  .game-category {
    display: inline-block;
    background-color: rgba(98, 0, 238, 0.2);
    color: var(--accent);
    padding: 4px 10px;
    border-radius: 20px;
    font-size: 0.85rem;
    margin-bottom: 12px;
    border: 1px solid var(--accent);
  }

  /* Favorite Action Button */
  .fav-action-btn {
    background-color: var(--surface);
    border: 1px solid #444;
    color: var(--text);
    width: 48px;
    height: 48px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: background 0.2s;
  }

  .fav-action-btn.active svg {
    fill: var(--highlight);
  }

  /* Meta Stats (No gap, using margins for compatibility) */
  .meta-grid {
    display: flex;
    margin-left: -6px;
    margin-right: -6px;
    margin-bottom: 16px;
  }

  .meta-card {
    flex: 1;
    margin-left: 6px;
    margin-right: 6px;
    background-color: var(--surface);
    padding: 12px;
    border-radius: 8px;
    text-align: center;
    border: 1px solid #2a2a2a;
  }

  .meta-card .label {
    font-size: 0.75rem;
    color: var(--text-muted);
    margin-bottom: 4px;
  }

  .meta-card .value {
    font-size: 1rem;
    color: #fff;
    font-weight: bold;
  }

  /* Description */
  .section-title {
    font-size: 1.1rem;
    color: var(--accent);
    margin-bottom: 8px;
    margin-top: 16px;
  }

  .description {
    font-size: 0.95rem;
    color: var(--text-muted);
    line-height: 1.6;
    margin-bottom: 24px;
    background-color: var(--surface);
    padding: 16px;
    border-radius: 8px;
    border: 1px solid #2a2a2a;
  }

  /* Action Buttons Area (No gap, using margins) */
  .action-area {
    display: flex;
    margin-left: -6px;
    margin-right: -6px;
  }

  .btn {
    flex: 1;
    margin-left: 6px;
    margin-right: 6px;
    height: 48px;
    border: none;
    border-radius: 8px;
    font-size: 1rem;
    font-weight: bold;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .btn svg {
    margin-left: 8px;
  }

  .btn-primary {
    background-color: var(--primary);
    color: #fff;
  }

  .btn-primary:active {
    background-color: var(--primary-dark);
  }

  .btn-accent {
    background-color: var(--accent);
    color: #000;
  }

  /* Bottom Navigation Bar */
  nav {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background-color: var(--surface);
    display: flex;
    justify-content: space-around;
    padding: 8px 0;
    border-top: 1px solid #333;
    z-index: 10;
  }

  .nav-item {
    color: var(--text-muted);
    text-decoration: none;
    font-size: 0.75rem;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    width: 25%;
    height: 44px;
  }

  .nav-item.active {
    color: var(--accent);
  }

  .nav-item svg {
    margin-bottom: 2px;
  }
</style>
</head>
<body>

  <header>
    <button class="back-btn" onclick="history.back()" aria-label="رجوع">
      <svg viewBox="0 0 24 24"><path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg>
    </button>
    <h1>تفاصيل اللعبة</h1>
    <div style="width: 44px;"></div>
  </header>

  <div class="container" id="game-container">
    <!-- Populated dynamically via JS -->
  </div>

  <!-- Bottom Navigation -->
  <nav>
    <a href="index.html" class="nav-item">
      <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
      الرئيسية
    </a>
    <a href="categories.html" class="nav-item">
      <svg viewBox="0 0 24 24"><path d="M4 6H2v14c0 1.1.9 2 2 2h14v-2H4V6zm16-4H8c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0-2-.9-2-2V4c0-1.1-.9-2-2-2zm0 14H8V4h12v12z"/></svg>
      التصنيفات
    </a>
    <a href="favorites.html" class="nav-item">
      <svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
      المفضلة
    </a>
    <a href="settings.html" class="nav-item">
      <svg viewBox="0 0 24 24"><path d="M19.43 12.98c.04-.32.07-.64.07-.98s-.03-.66-.07-.98l2.11-1.65c.19-.15.24-.42.12-.64l-2-3.46c-.12-.22-.39-.3-.61-.22l-2.49 1c-.52-.4-1.08-.73-1.69-.98l-.38-2.65C14.03 2.18 13.82 2 13.6 2h-4c-.22 0-.43.18-.47.41l-.38 2.65c-.61.25-1.17.59-1.69.98l-2.49-1c-.23-.09-.49 0-.61.22l-2 3.46c-.13.22-.07.49.12.64l2.11 1.65c-.04.32-.07.65-.07.98s.03.66.07.98l-2.11 1.65c-.19.15-.24.42-.12.64l2 3.46c.12.22.39.3.61.22l2.49-1c.52.4 1.08.73 1.69.98l.38 2.65c.04.22.25.41.47.41h4c.22 0 .43-.18.47-.41l.38-2.65c.61-.25 1.17-.59 1.69-.98l2.49 1c.23.09.49 0 .61-.22l2-3.46c.12-.22.07-.49-.12-.64l-2.11-1.65zM12 15.5c-1.93 0-3.5-1.57-3.5-3.5s1.57-3.5 3.5-3.5 3.5 1.57 3.5 3.5-1.57 3.5-3.5 3.5z"/></svg>
      الإعدادات
    </a>
  </nav>

<script>
  // Web Audio API feedback
  function playClickSound() {
    try {
      var audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      var osc = audioCtx.createOscillator();
      var gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(440, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.08);
      gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.08);
    } catch(e) {}
  }

  // Comprehensive games database
  var gamesDatabase = {
    "1": {
      id: "1",
      title: "المغامر الصغير",
      category: "مغامرة",
      rating: "4.8",
      size: "45 ميجابايت",
      downloads: "10 ألف+",
      description: "انطلق في رحلة ملحمية عبر عوالم ساحرة مليئة بالألغاز والتحديات الفريدة. اجمع الجواهر واهزم الوحوش الصغيرة لاستعادة السلام في المملكة."
    },
    "2": {
      id: "2",
      title: "أسرار المتاهة",
      category: "ألغاز",
      rating: "4.6",
      size: "30 ميجابايت",
      downloads: "25 ألف+",
      description: "اختبر ذكاءك في متاهات معقدة تتطلب تفكيراً عميقاً وحلاً دقيقاً للألغاز. كل مستوى يفتح آفاقاً جديدة وتحديات أكثر صعوبة."
    },
    "3": {
      id: "3",
      title: "سرعة البرق",
      category: "حركة",
      rating: "4.9",
      size: "120 ميجابايت",
      downloads: "50 ألف+",
      description: "لعبة سباق وتحدي حركة سريعة الوتيرة. تفادى العوائق واجمع التعزيزات لتصل إلى خط النهاية بأسرع وقت ممكن."
    },
    "4": {
      id: "4",
      title: "مزرعة السعادة",
      category: "استراتيجية",
      rating: "4.7",
      size: "60 ميجابايت",
      downloads: "15 ألف+",
      description: "ابني مزرعتك الخاصة واعتنِ بالحيوانات والمحاصيل الزراعية. خطط بعناية لزيادة إنتاجك وتطوير قريتك."
    }
  };

  // Default to game "1" if none specified
  var urlParams = new URLSearchParams(window.location.search);
  var gameId = urlParams.get("id");
  if (!gameId || !gamesDatabase[gameId]) {
    gameId = "1";
  }

  var currentGame = gamesDatabase[gameId];

  // Favorites handling via localStorage
  function getFavorites() {
    try {
      var favs = localStorage.getItem("game_favorites");
      return favs ? JSON.parse(favs) : [];
    } catch(e) {
      return [];
    }
  }

  function isFavorite(id) {
    var favs = getFavorites();
    return favs.indexOf(id) !== -1;
  }

  function toggleFavorite(id) {
    playClickSound();
    try {
      var favs = getFavorites();
      var index = favs.indexOf(id);
      if (index !== -1) {
        favs.splice(index, 1);
      } else {
        favs.push(id);
      }
      localStorage.setItem("game_favorites", JSON.stringify(favs));
      renderGameDetails();
    } catch(e) {
      alert("تعذر حفظ المفضلة حالياً");
    }
  }

  function renderGameDetails() {
    var container = document.getElementById("game-container");
    var favActive = isFavorite(currentGame.id) ? "active" : "";

    container.innerHTML = 
      '<div class="game-banner">' +
        '<svg class="large-icon" viewBox="0 0 24 24"><path d="M21 6H3c-1.1 0-2 .9-2 2v8c0 1.1.9 2 2 2h18c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm-10 7H8v3H6v-3H3v-2h3V8h2v3h3v2zm4.5 2c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zm3-4c-.83 0-1.5-.67-1.5-1.5S17.67 8 18.5 8s1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"/></svg>' +
      '</div>' +

      '<div class="game-header-info">' +
        '<div>' +
          '<span class="game-category">' + currentGame.category + '</span>' +
          '<h2 class="game-title">' + currentGame.title + '</h2>' +
        '</div>' +
        '<button class="fav-action-btn ' + favActive + '" onclick="toggleFavorite(\'' + currentGame.id + '\')" aria-label="حفظ في المفضلة">' +
          '<svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>' +
        '</button>' +
      '</div>' +

      '<div class="meta-grid">' +
        '<div class="meta-card">' +
          '<div class="label">التقييم</div>' +
          '<div class="value">' + currentGame.rating + ' ★</div>' +
        '</div>' +
        '<div class="meta-card">' +
          '<div class="label">الحجم</div>' +
          '<div class="value">' + currentGame.size + '</div>' +
        '</div>' +
        '<div class="meta-card">' +
          '<div class="label">التحميلات</div>' +
          '<div class="value">' + currentGame.downloads + '</div>' +
        '</div>' +
      '</div>' +

      '<div class="section-title">نبذة عن اللعبة</div>' +
      '<div class="description">' + currentGame.description + '</div>' +

      '<div class="action-area">' +
        '<button class="btn btn-primary" onclick="handlePlay()">' +
          '<svg viewBox="0 0 24 24" style="width:20px;height:20px;fill:currentColor;"><path d="M8 5v14l11-7z"/></svg>' +
          'العب الآن' +
        '</button>' +
        '<button class="btn btn-accent" onclick="handleDownload()">' +
          '<svg viewBox="0 0 24 24" style="width:20px;height:20px;fill:currentColor;"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>' +
          'تحميل' +
        '</button>' +
      '</div>';
  }

  function handlePlay() {
    playClickSound();
    alert("جاري تشغيل لعبة " + currentGame.title + "...");
  }

  function handleDownload() {
    playClickSound();
    alert("بدء تحميل ملفات لعبة " + currentGame.title + "...");
  }

  // Initial render
  renderGameDetails();
</script>
</body>
</html>
