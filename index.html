<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>الرئيسية - مكتبة الألعاب المتواضعة</title>
<style>
:root {
  --primary: #6200EE;
  --primary-dark: #3700B3;
  --accent: #03DAC6;
  --highlight: #FF0266;
  --control: #B0BEC5;
  --bg: #121212;
  --surface: #1E1E1E;
  --surface-light: #2D2D2D;
  --text: #E0E0E0;
  --text-muted: #9E9E9E;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: Tahoma, Arial, sans-serif;
  -webkit-tap-highlight-color: transparent;
}

body {
  background-color: var(--bg);
  color: var(--text);
  padding-bottom: 70px;
}

header {
  background-color: var(--surface);
  padding: 16px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid var(--surface-light);
  position: sticky;
  top: 0;
  z-index: 100;
}

.logo-area {
  display: flex;
  align-items: center;
}

.logo-area svg {
  width: 28px;
  height: 28px;
  fill: var(--accent);
  margin-left: 12px;
}

header h1 {
  font-size: 18px;
  color: #fff;
}

.search-box {
  padding: 12px 16px;
  background-color: var(--surface);
  border-bottom: 1px solid var(--surface-light);
}

.search-input {
  width: 100%;
  padding: 10px 14px;
  background-color: var(--surface-light);
  border: 1px solid var(--control);
  border-radius: 8px;
  color: #fff;
  font-size: 14px;
}

.search-input:focus {
  outline: none;
  border-color: var(--accent);
}

.section {
  padding: 16px;
}

.section-title {
  font-size: 16px;
  color: var(--accent);
  margin-bottom: 12px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

/* Featured Carousel */
.featured-scroll {
  display: flex;
  overflow-x: auto;
  padding-bottom: 8px;
  scroll-snap-type: x mandatory;
}

.featured-card {
  min-width: 260px;
  height: 150px;
  background-color: var(--surface);
  border-radius: 12px;
  overflow: hidden;
  position: relative;
  flex-shrink: 0;
  scroll-snap-align: start;
  text-decoration: none;
  color: inherit;
  border: 1px solid var(--surface-light);
  margin-left: 12px;
}

.featured-card:last-child {
  margin-left: 0;
}

.featured-card img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.featured-overlay {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  background: linear-gradient(transparent, rgba(0,0,0,0.85));
  padding: 12px;
}

.featured-title {
  font-size: 15px;
  font-weight: bold;
  color: #fff;
  margin-bottom: 4px;
}

.featured-genre {
  font-size: 11px;
  color: var(--accent);
}

/* Games Grid */
.games-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  grid-gap: 12px;
}

.game-card {
  background-color: var(--surface);
  border-radius: 10px;
  overflow: hidden;
  text-decoration: none;
  color: inherit;
  border: 1px solid var(--surface-light);
  display: flex;
  flex-direction: column;
}

.game-thumb {
  width: 100%;
  height: 110px;
  object-fit: cover;
  background-color: var(--surface-light);
}

.game-info {
  padding: 10px;
  display: flex;
  flex-direction: column;
  flex-grow: 1;
}

.game-title {
  font-size: 13px;
  font-weight: bold;
  color: #fff;
  margin-bottom: 4px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.game-meta {
  font-size: 11px;
  color: var(--text-muted);
  margin-bottom: 8px;
}

.game-footer {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: auto;
}

.game-rating {
  font-size: 11px;
  color: var(--highlight);
  font-weight: bold;
}

.fav-btn {
  background: none;
  border: none;
  cursor: pointer;
  padding: 6px;
  min-width: 44px;
  min-height: 44px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.fav-btn svg {
  width: 20px;
  height: 20px;
  fill: var(--control);
  transition: fill 0.2s;
}

.fav-btn.active svg {
  fill: var(--highlight);
}

/* Bottom Navigation */
nav {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  height: 60px;
  background-color: var(--surface);
  border-top: 1px solid var(--surface-light);
  display: flex;
  justify-content: space-around;
  align-items: center;
  z-index: 100;
}

.nav-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  text-decoration: none;
  color: var(--text-muted);
  font-size: 10px;
  min-width: 44px;
  min-height: 44px;
  justify-content: center;
  flex: 1;
}

.nav-item svg {
  width: 22px;
  height: 22px;
  fill: var(--text-muted);
  margin-bottom: 3px;
}

.nav-item.active {
  color: var(--accent);
}

.nav-item.active svg {
  fill: var(--accent);
}

.no-results {
  grid-column: span 2;
  text-align: center;
  padding: 30px;
  color: var(--text-muted);
  font-size: 13px;
}
</style>
</head>
<body>

<header>
  <div class="logo-area">
    <svg viewBox="0 0 24 24"><path d="M21 6H3c-1.1 0-2 .9-2 2v8c0 1.1.9 2 2 2h18c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm-10 7H8v3H6v-3H3v-2h3V8h2v3h3v2zm4.5 2c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zm3-4c-.83 0-1.5-.67-1.5-1.5S17.67 8 18.5 8s1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"/></svg>
    <h1>مكتبة الألعاب</h1>
  </div>
</header>

<div class="search-box">
  <input type="text" id="searchInput" class="search-input" placeholder="ابحث في الألعاب المتواضعة...">
</div>

<div class="section" id="featuredSection">
  <div class="section-title">الألعاب المميزة</div>
  <div class="featured-scroll" id="featuredContainer">
    <!-- Rendered via JS -->
  </div>
</div>

<div class="section">
  <div class="section-title">أحدث الألعاب</div>
  <div class="games-grid" id="gamesContainer">
    <!-- Rendered via JS -->
  </div>
</div>

<nav>
  <a href="index.html" class="nav-item active">
    <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
    الرئيسية
  </a>
  <a href="categories.html" class="nav-item">
    <svg viewBox="0 0 24 24"><path d="M4 8h4V4H4v4zm6 12h4v-4h-4v4zm-6 0h4v-4H4v4zm0-6h4v-4H4v4zm6 0h4v-4h-4v4zm6-10v4h4V4h-4zm-6 4h4V4h-4v4zm6 6h4v-4h-4v4zm0 6h4v-4h-4v4z"/></svg>
    التصنيفات
  </a>
  <a href="favorites.html" class="nav-item">
    <svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
    المفضلة
  </a>
  <a href="settings.html" class="nav-item">
    <svg viewBox="0 0 24 24"><path d="M19.43 12.98c.04-.32.07-.64.07-.98s-.03-.66-.07-.98l2.11-1.65c.19-.15.24-.42.12-.64l-2-3.46c-.12-.22-.39-.3-.61-.22l-2.49 1c-.52-.4-1.08-.73-1.69-.98l-.38-2.65C14.46 2.18 14.25 2 14 2h-4c-.25 0-.46.18-.49.42l-.38 2.65c-.61.25-1.17.59-1.69.98l-2.49-1c-.23-.09-.49 0-.61.22l-2 3.46c-.13.22-.07.49.12.64l2.11 1.65c-.04.32-.07.65-.07.98s.03.66.07.98l-2.11 1.65c-.19.15-.24.42-.12.64l2 3.46c.12.22.39.3.61.22l2.49-1c.52.4 1.08.73 1.69.98l.38 2.65c.03.24.24.42.49.42h4c.25 0 .46-.18.49-.42l.38-2.65c.61-.25 1.17-.59 1.69-.98l2.49 1c.23.09.49 0 .61-.22l2-3.46c.12-.22.07-.49-.12-.64l-2.11-1.65zM12 15.5c-1.93 0-3.5-1.57-3.5-3.5s1.57-3.5 3.5-3.5 3.5 1.57 3.5 3.5-1.57 3.5-3.5 3.5z"/></svg>
    الإعدادات
  </a>
</nav>

<script>
var gamesData = [
  {
    id: 1,
    title: "مغامرة الصحراء الكبرى",
    genre: "مغامرة",
    rating: "4.8",
    downloads: "12K",
    featured: true,
    svgThumb: '<svg viewBox="0 0 24 24" width="100%" height="100%"><rect width="24" height="24" fill="#3E2723"/><circle cx="18" cy="6" r="3" fill="#FFB300"/><path d="M0 20l6-8 4 4 6-10 8 14z" fill="#D7CCC8"/></svg>'
  },
  {
    id: 2,
    title: "لغز المعبد القديم",
    genre: "ألغاز",
    rating: "4.6",
    downloads: "8.5K",
    featured: true,
    svgThumb: '<svg viewBox="0 0 24 24" width="100%" height="100%"><rect width="24" height="24" fill="#1A237E"/><path d="M4 4h16v16H4z" fill="none" stroke="#7986CB" stroke-width="2"/><circle cx="12" cy="12" r="4" fill="#FFD54F"/></svg>'
  },
  {
    id: 3,
    title: "متسابق السرعة القصوى",
    genre: "حركة",
    rating: "4.9",
    downloads: "25K",
    featured: true,
    svgThumb: '<svg viewBox="0 0 24 24" width="100%" height="100%"><rect width="24" height="24" fill="#B71C1C"/><path d="M2 14h20v4H2z" fill="#37474F"/><circle cx="7" cy="18" r="2" fill="#212121"/><circle cx="17" cy="18" r="2" fill="#212121"/></svg>'
  },
  {
    id: 4,
    title: "قلعة الفضاء الغامضة",
    genre: "مغامرة",
    rating: "4.5",
    downloads: "6.2K",
    featured: false,
    svgThumb: '<svg viewBox="0 0 24 24" width="100%" height="100%"><rect width="24" height="24" fill="#000000"/><polygon points="12,2 15,10 23,12 16,17 18,24 12,20 6,24 8,17 1,12 9,10" fill="#7C4DFF"/></svg>'
  },
  {
    id: 5,
    title: "تحدي الأرقام الذكية",
    genre: "ألغاز",
    rating: "4.3",
    downloads: "4.1K",
    featured: false,
    svgThumb: '<svg viewBox="0 0 24 24" width="100%" height="100%"><rect width="24" height="24" fill="#00695C"/><text x="6" y="17" font-size="14" fill="#E0F2F1" font-weight="bold">123</text></svg>'
  },
  {
    id: 6,
    title: "معركة الساحة الفولاذية",
    genre: "حركة",
    rating: "4.7",
    downloads: "15K",
    featured: false,
    svgThumb: '<svg viewBox="0 0 24 24" width="100%" height="100%"><rect width="24" height="24" fill="#263238"/><path d="M3 3l18 18M21 3L3 21" stroke="#FF5722" stroke-width="3"/></svg>'
  }
];

function getFavorites() {
  try {
    var stored = localStorage.getItem("humble_favorites");
    if (stored) {
      return JSON.parse(stored);
    }
  } catch (e) {}
  return [];
}

function saveFavorites(favs) {
  try {
    localStorage.setItem("humble_favorites", JSON.stringify(favs));
  } catch (e) {}
}

function toggleFav(id, event) {
  event.preventDefault();
  event.stopPropagation();
  var favs = getFavorites();
  var index = favs.indexOf(id);
  if (index > -1) {
    favs.splice(index, 1);
  } else {
    favs.push(id);
  }
  saveFavorites(favs);
  renderApp();
}

function renderApp() {
  var query = document.getElementById("searchInput").value.trim().toLowerCase();
  var favs = getFavorites();

  var featuredContainer = document.getElementById("featuredContainer");
  var featuredSection = document.getElementById("featuredSection");
  var gamesContainer = document.getElementById("gamesContainer");

  // Filter featured
  var featuredHtml = "";
  var featuredList = [];
  for (var i = 0; i < gamesData.length; i++) {
    if (gamesData[i].featured) {
      if (!query || gamesData[i].title.toLowerCase().indexOf(query) > -1 || gamesData[i].genre.toLowerCase().indexOf(query) > -1) {
        featuredList.push(gamesData[i]);
      }
    }
  }

  if (featuredList.length > 0 && !query) {
    featuredSection.style.display = "block";
    for (var i = 0; i < featuredList.length; i++) {
      var game = featuredList[i];
      featuredHtml += '<a href="game-details.html?id=' + game.id + '" class="featured-card">' +
        game.svgThumb +
        '<div class="featured-overlay">' +
          '<div class="featured-title">' + game.title + '</div>' +
          '<div class="featured-genre">' + game.genre + '</div>' +
        '</div>' +
      '</a>';
    }
    featuredContainer.innerHTML = featuredHtml;
  } else {
    featuredSection.style.display = "none";
  }

  // Filter all games
  var gamesHtml = "";
  var matchCount = 0;
  for (var i = 0; i < gamesData.length; i++) {
    var game = gamesData[i];
    if (!query || game.title.toLowerCase().indexOf(query) > -1 || game.genre.toLowerCase().indexOf(query) > -1) {
      matchCount++;
      var isFav = favs.indexOf(game.id) > -1;
      gamesHtml += '<a href="game-details.html?id=' + game.id + '" class="game-card">' +
        '<div class="game-thumb">' + game.svgThumb + '</div>' +
        '<div class="game-info">' +
          '<div class="game-title">' + game.title + '</div>' +
          '<div class="game-meta">' + game.genre + ' • ' + game.downloads + '</div>' +
          '<div class="game-footer">' +
            '<span class="game-rating">★ ' + game.rating + '</span>' +
            '<button class="fav-btn ' + (isFav ? 'active' : '') + '" onclick="toggleFav(' + game.id + ', event)">' +
              '<svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>' +
            '</button>' +
          '</div>' +
        '</div>' +
      '</a>';
    }
  }

  if (matchCount === 0) {
    gamesHtml = '<div class="no-results">لا توجد ألعاب مطابقة للبحث</div>';
  }

  gamesContainer.innerHTML = gamesHtml;
}

document.getElementById("searchInput").addEventListener("input", renderApp);

// Initial render
renderApp();
</script>

</body>
</html>
