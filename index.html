<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>الرئيسية - ألغاز و العاب ذكاء</title>
<style>
:root {
  --primary: #6200EE;
  --primary-dark: #3700B3;
  --accent: #03DAC6;
  --highlight: #FFEB3B;
  --control: #B0BEC5;
  --bg-dark: #121212;
  --surface: #1E1E1E;
  --surface-card: #252525;
  --text-main: #E0E0E0;
  --text-muted: #9E9E9E;
  --danger: #CF6679;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
}

body {
  background-color: var(--bg-dark);
  color: var(--text-main);
  font-family: system-ui, -apple-system, Roboto, sans-serif;
  padding-top: env(safe-area-inset-top);
  padding-bottom: env(safe-area-inset-bottom);
  overflow-x: hidden;
  display: flex;
  flex-direction: column;
  height: 100vh;
}

/* App Bar */
.app-bar {
  background-color: var(--surface);
  height: 56px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 16px;
  position: sticky;
  top: 0;
  z-index: 100;
  border-bottom: 1px solid rgba(255,255,255,0.08);
}

.app-title {
  font-size: 18px;
  font-weight: bold;
  color: var(--text-main);
}

.app-actions {
  display: flex;
}

.app-actions > * + * {
  margin-right: 8px;
}

.icon-btn {
  background: none;
  border: none;
  width: 40px;
  height: 40px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--text-main);
  cursor: pointer;
}

.icon-btn:active {
  background-color: rgba(255,255,255,0.1);
}

.icon-btn svg {
  width: 24px;
  height: 24px;
  fill: currentColor;
}

/* Main Content Container */
.content-container {
  flex: 1;
  overflow-y: auto;
  padding: 16px;
  padding-bottom: 80px;
}

/* Banner */
.banner-card {
  background: linear-gradient(135deg, var(--primary-dark), var(--primary));
  border-radius: 16px;
  padding: 20px;
  margin-bottom: 20px;
  position: relative;
  overflow: hidden;
  box-shadow: 0 4px 12px rgba(98, 0, 238, 0.3);
}

.banner-title {
  font-size: 20px;
  font-weight: bold;
  color: #ffffff;
  margin-bottom: 8px;
}

.banner-desc {
  font-size: 14px;
  color: rgba(255,255,255,0.8);
  margin-bottom: 16px;
  line-height: 1.4;
}

.banner-btn {
  background-color: var(--accent);
  color: #000000;
  border: none;
  padding: 10px 20px;
  border-radius: 20px;
  font-weight: bold;
  font-size: 14px;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  text-decoration: none;
}

.banner-btn svg {
  margin-right: 8px;
}

.banner-btn:active {
  opacity: 0.8;
}

/* Section Header */
.section-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 12px;
}

.section-title {
  font-size: 16px;
  font-weight: bold;
  color: var(--text-main);
}

.section-filter {
  font-size: 12px;
  color: var(--accent);
  background: none;
  border: none;
  cursor: pointer;
}

/* Game List / Cards */
.games-grid {
  display: flex;
  flex-direction: column;
}

.games-grid > * + * {
  margin-top: 12px;
}

.game-card {
  background-color: var(--surface-card);
  border-radius: 12px;
  padding: 12px;
  display: flex;
  align-items: center;
  cursor: pointer;
  border: 1px solid rgba(255,255,255,0.04);
  transition: background-color 0.2s;
  text-decoration: none;
  color: inherit;
}

.game-card:active {
  background-color: rgba(255,255,255,0.06);
}

.game-icon {
  width: 64px;
  height: 64px;
  border-radius: 12px;
  flex-shrink: 0;
  object-fit: cover;
  margin-left: 12px;
}

.game-info {
  flex: 1;
  min-width: 0;
}

.game-title {
  font-size: 16px;
  font-weight: bold;
  color: var(--text-main);
  margin-bottom: 4px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.game-desc {
  font-size: 12px;
  color: var(--text-muted);
  margin-bottom: 8px;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  line-height: 1.3;
}

.game-meta {
  display: flex;
  font-size: 11px;
  color: var(--control);
}

.game-meta span {
  display: flex;
  align-items: center;
}

.game-meta span svg {
  margin-left: 4px;
}

/* Bottom Navigation */
.bottom-nav {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  height: 60px;
  background-color: var(--surface);
  display: flex;
  justify-content: space-around;
  align-items: center;
  border-top: 1px solid rgba(255,255,255,0.08);
  z-index: 100;
  padding-bottom: env(safe-area-inset-bottom);
}

.nav-item {
  flex: 1;
  height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: none;
  border: none;
  color: var(--text-muted);
  text-decoration: none;
  font-size: 10px;
  cursor: pointer;
}

.nav-item span {
  margin-top: 4px;
}

.nav-item.active {
  color: var(--accent);
}

.nav-item:active {
  background-color: rgba(255,255,255,0.05);
}

.nav-item svg {
  width: 22px;
  height: 22px;
  fill: currentColor;
}

/* Loading State */
.loading-box {
  text-align: center;
  padding: 40px;
  color: var(--text-muted);
  font-size: 14px;
}
</style>
<style id="rt-native">html,body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}input,textarea,select,[contenteditable],.rt-selectable,.rt-selectable *{-webkit-user-select:text;user-select:text}img,a{-webkit-user-drag:none}a,button,[role=button]{outline:none}</style>
</head>
<body>

  <!-- App Bar -->
  <header class="app-bar">
    <h1 class="app-title">الرئيسية</h1>
    <div class="app-actions">
      <a href="admin.html" class="icon-btn" aria-label="لوحة التحكم">
        <svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
      </a>
    </div>
  </header>

  <!-- Main Scrollable Area -->
  <main class="content-container">
    
    <!-- Floating Window Guide Banner -->
    <div class="banner-card">
      <h2 class="banner-title">ميزة النافذة العائمة</h2>
      <p class="banner-desc">تعلم كيف تستخدم النافذة العائمة لحل الألغاز الصعبة فوق التطبيقات الأخرى بكل سهولة ويسر.</p>
      <a href="overlay-guide.html" class="banner-btn">
        <svg viewBox="0 0 24 24" style="width:16px;height:16px;fill:currentColor;"><path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg>
        <span>قراءة الإرشادات</span>
      </a>
    </div>

    <!-- Section Title -->
    <div class="section-header">
      <h3 class="section-title">الألغاز والألعاب المتاحة</h3>
      <button class="section-filter" id="refresh-btn">إعادة تحميل</button>
    </div>

    <!-- Games Container -->
    <div id="games-container" class="games-grid">
      <div class="loading-box">جاري تحميل الألغاز...</div>
    </div>

  </main>

  <!-- Bottom Navigation -->
  <nav class="bottom-nav">
    <a href="index.html" class="nav-item active">
      <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
      <span>الرئيسية</span>
    </a>
    <a href="scores.html" class="nav-item">
      <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zM9 17H7v-7h2v7zm4 0h-2V7h2v10zm4 0h-2v-4h2v4z"/></svg>
      <span>النتائج</span>
    </a>
    <a href="overlay-guide.html" class="nav-item">
      <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V5h14v14zM7 10h2v7H7zm4-3h2v10h-2zm4 5h2v5h-2z"/></svg>
      <span>الإرشادات</span>
    </a>
  </nav>

  <script>
    function loadGames() {
      var container = document.getElementById('games-container');
      container.innerHTML = '<div class="loading-box">جاري تحميل الألغاز...</div>';

      fetch('games.json')
        .then(function(response) {
          if (!response.ok) {
            throw new Error('فشل في تحميل البيانات');
          }
          return response.json();
        })
        .then(function(data) {
          container.innerHTML = '';
          if (!data || data.length === 0) {
            container.innerHTML = '<div class="loading-box">لا توجد ألغاز متاحة حالياً.</div>';
            return;
          }

          for (var i = 0; i < data.length; i++) {
            var item = data[i];
            
            var card = document.createElement('a');
            card.className = 'game-card';
            card.href = 'puzzle-view.html?id=' + encodeURIComponent(item.id || i);

            var iconImg = document.createElement('img');
            iconImg.className = 'game-icon';
            if (item.image) {
              iconImg.src = item.image;
            } else {
              iconImg.src = 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 24 24"><rect width="24" height="24" fill="%233700B3"/><text x="12" y="16" fill="%2303DAC6" font-size="10" text-anchor="middle">لغز</text></svg>';
            }
            iconImg.alt = item.title || 'لغز';

            var infoDiv = document.createElement('div');
            infoDiv.className = 'game-info';

            var titleEl = document.createElement('div');
            titleEl.className = 'game-title rt-selectable';
            titleEl.textContent = item.title || 'لغز بدون عنوان';

            var descEl = document.createElement('div');
            descEl.className = 'game-desc rt-selectable';
            descEl.textContent = item.description || 'لا يوجد وصف متاح.';

            var metaEl = document.createElement('div');
            metaEl.className = 'game-meta';
            
            var diffSpan = document.createElement('span');
            diffSpan.innerHTML = '<svg viewBox="0 0 24 24" style="width:12px;height:12px;fill:currentColor;"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/></svg>' + (item.difficulty || 'متوسط');
            
            metaEl.appendChild(diffSpan);

            infoDiv.appendChild(titleEl);
            infoDiv.appendChild(descEl);
            infoDiv.appendChild(metaEl);

            card.appendChild(iconImg);
            card.appendChild(infoDiv);

            container.appendChild(card);
          }
        })
        .catch(function(error) {
          container.innerHTML = '<div class="loading-box" style="color: var(--danger);">عذراً، حدث خطأ أثناء تحميل الألغاز. يرجى التأكد من الملفات.</div>';
        });
    }

    document.getElementById('refresh-btn').addEventListener('click', function() {
      loadGames();
    });

    // Initial load
    loadGames();
  </script>
</body>
</html>
