<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>المفضلة - مكتبة الألعاب المتواضعة</title>
<style>
  :root {
    --primary: #6200EE;
    --primary-dark: #3700B3;
    --accent: #03DAC6;
    --highlight: #FF0266;
    --control: #B0BEC5;
    --bg: #121212;
    --surface: #1E1E1E;
    --surface-card: #2A2A2A;
    --text: #E0E0E0;
    --text-muted: #9E9E9E;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Tahoma, Arial, sans-serif;
  }

  body {
    background-color: var(--bg);
    color: var(--text);
    padding-bottom: 70px;
  }

  header {
    background-color: var(--surface);
    padding: 16px;
    text-align: center;
    border-bottom: 1px solid #333;
    position: sticky;
    top: 0;
    z-index: 10;
  }

  header h1 {
    font-size: 1.2rem;
    color: var(--accent);
  }

  .container {
    padding: 16px;
    max-width: 600px;
    margin: 0 auto;
  }

  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--text-muted);
  }

  .empty-state svg {
    width: 64px;
    height: 64px;
    fill: var(--control);
    margin-bottom: 16px;
  }

  .empty-state p {
    font-size: 1rem;
    margin-bottom: 20px;
  }

  .browse-btn {
    display: inline-block;
    background-color: var(--primary);
    color: #fff;
    padding: 12px 24px;
    border-radius: 8px;
    text-decoration: none;
    font-weight: bold;
    min-height: 44px;
    line-height: 20px;
  }

  .game-card {
    background-color: var(--surface-card);
    border-radius: 12px;
    overflow: hidden;
    margin-bottom: 16px;
    display: flex;
    position: relative;
    box-shadow: 0 4px 6px rgba(0,0,0,0.3);
  }

  .game-thumb {
    width: 100px;
    height: 100px;
    background-color: #333;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .game-thumb svg {
    width: 40px;
    height: 40px;
    fill: var(--control);
  }

  .game-info {
    padding: 12px;
    flex-grow: 1;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }

  .game-title {
    font-size: 1rem;
    font-weight: bold;
    color: #fff;
    margin-bottom: 4px;
  }

  .game-genre {
    font-size: 0.8rem;
    color: var(--text-muted);
    margin-bottom: 8px;
  }

  .game-actions {
    display: flex;
    justify-content: flex-end;
  }

  .action-btn {
    background: transparent;
    border: none;
    cursor: pointer;
    padding: 8px;
    min-width: 44px;
    min-height: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .action-btn svg {
    width: 22px;
    height: 22px;
    fill: var(--highlight);
  }

  .play-link {
    background-color: var(--accent);
    color: #000;
    padding: 6px 12px;
    border-radius: 6px;
    text-decoration: none;
    font-size: 0.8rem;
    font-weight: bold;
    min-height: 44px;
    display: inline-flex;
    align-items: center;
    margin-left: 8px;
  }

  /* Bottom Navigation */
  nav {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    height: 60px;
    background-color: var(--surface);
    border-top: 1px solid #333;
    display: flex;
    justify-content: space-around;
    align-items: center;
    z-index: 100;
  }

  nav a {
    text-decoration: none;
    color: var(--text-muted);
    display: flex;
    flex-direction: column;
    align-items: center;
    font-size: 0.7rem;
    min-width: 44px;
    min-height: 44px;
    justify-content: center;
    flex-grow: 1;
  }

  nav a.active {
    color: var(--accent);
  }

  nav a svg {
    width: 22px;
    height: 22px;
    fill: currentColor;
    margin-bottom: 4px;
  }
</style>
</head>
<body>

<header>
  <h1>الألعاب المفضلة</h1>
</header>

<div class="container" id="favorites-container">
  <!-- Dynamic Content -->
</div>

<nav>
  <a href="index.html">
    <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
    الرئيسية
  </a>
  <a href="categories.html">
    <svg viewBox="0 0 24 24"><path d="M4 6H2v14c0 1.1.9 2 2 2h14v-2H4V6zm16-4H8c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H8V4h12v12z"/></svg>
    التصنيفات
  </a>
  <a href="favorites.html" class="active">
    <svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
    المفضلة
  </a>
  <a href="settings.html">
    <svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
    الإعدادات
  </a>
</nav>

<script>
  // Fallback sample favorites if storage is empty
  var sampleGames = [
    { id: '1', title: 'مغامرات الفضاء', genre: 'مغامرة' },
    { id: '2', title: 'لغز الأرقام', genre: 'ألغاز' }
  ];

  function getFavorites() {
    try {
      var favs = localStorage.getItem('modest_favorites');
      if (favs) {
        return JSON.parse(favs);
      }
    } catch (e) {
      // Storage unavailable
    }
    return sampleGames;
  }

  function saveFavorites(favs) {
    try {
      localStorage.setItem('modest_favorites', JSON.stringify(favs));
    } catch (e) {
      // Storage unavailable
    }
  }

  function renderFavorites() {
    var container = document.getElementById('favorites-container');
    var favs = getFavorites();

    if (!favs || favs.length === 0) {
      container.innerHTML = 
        '<div class="empty-state">' +
          '<svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>' +
          '<p>ليس لديك أي ألعاب في المفضلة حالياً</p>' +
          '<a href="categories.html" class="browse-btn">تصفح الألعاب</a>' +
        '</div>';
      return;
    }

    var html = '';
    var i = 0;
    while (i < favs.length) {
      var game = favs[i];
      html += 
        '<div class="game-card" id="game-' + game.id + '">' +
          '<div class="game-thumb">' +
            '<svg viewBox="0 0 24 24"><path d="M21 6H3c-1.1 0-2 .9-2 2v8c0 1.1.9 2 2 2h18c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm-10 7H8v3H6v-3H3v-2h3V8h2v3h3v2zm4.5 2c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zm3-3c-.83 0-1.5-.67-1.5-1.5S19.67 9 20.5 9s1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"/></svg>' +
          '</div>' +
          '<div class="game-info">' +
            '<div>' +
              '<div class="game-title">' + game.title + '</div>' +
              '<div class="game-genre">' + game.genre + '</div>' +
            '</div>' +
            '<div class="game-actions">' +
              '<a href="game-details.html?id=' + game.id + '" class="play-link">العب الآن</a>' +
              '<button class="action-btn" onclick="removeFavorite(\'' + game.id + '\')" aria-label="إزالة من المفضلة">' +
                '<svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>' +
              '</button>' +
            '</div>' +
          '</div>' +
        '</div>';
      i++;
    }
    container.innerHTML = html;
  }

  function removeFavorite(id) {
    var favs = getFavorites();
    var newFavs = [];
    var i = 0;
    while (i < favs.length) {
      if (favs[i].id !== id) {
        newFavs.push(favs[i]);
      }
      i++;
    }
    saveFavorites(newFavs);
    renderFavorites();
  }

  window.onload = function() {
    renderFavorites();
  };
</script>

</body>
</html>
