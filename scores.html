<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>النتائج والإنجازات</title>
<style>
  :root {
    --primary: #6200EE;
    --primary-dark: #3700B3;
    --accent: #03DAC6;
    --highlight: #FFEB3B;
    --control: #B0BEC5;
    --bg-dark: #121212;
    --surface: #1E1E1E;
    --surface-card: #2A2A2A;
    --text-main: #E0E0E0;
    --text-muted: #9E9E9E;
    --danger: #CF6679;
    --success: #03DAC6;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
  }

  body {
    background-color: var(--bg-dark);
    color: var(--text-main);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    min-height: 100vh;
    padding-top: env(safe-area-inset-top);
    padding-bottom: calc(70px + env(safe-area-inset-bottom));
    overflow-x: hidden;
  }

  /* App Bar */
  .app-bar {
    position: fixed;
    top: env(safe-area-inset-top);
    left: 0;
    right: 0;
    height: 56px;
    background-color: var(--surface);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 16px;
    z-index: 100;
    border-bottom: 1px solid rgba(255,255,255,0.08);
  }

  .app-bar h1 {
    font-size: 18px;
    font-weight: 600;
    color: var(--text-main);
  }

  .app-bar-actions {
    display: flex;
  }

  .icon-btn {
    background: none;
    border: none;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-main);
    cursor: pointer;
    transition: background-color 0.2s;
  }

  .icon-btn:active {
    background-color: rgba(255,255,255,0.1);
  }

  .icon-btn svg {
    width: 24px;
    height: 24px;
    fill: currentColor;
  }

  /* Main Container */
  .container {
    padding: 72px 16px 16px 16px;
    max-width: 600px;
    margin: 0 auto;
  }

  /* Stats Overview Card */
  .overview-card {
    background: linear-gradient(135deg, var(--primary-dark), var(--primary));
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 24px;
    box-shadow: 0 8px 16px rgba(98, 0, 238, 0.2);
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
  }

  .overview-title {
    font-size: 14px;
    color: rgba(255,255,255,0.8);
    margin-bottom: 8px;
  }

  .overview-score {
    font-size: 36px;
    font-weight: bold;
    color: #fff;
    margin-bottom: 16px;
  }

  .stats-grid {
    display: flex;
    width: 100%;
    justify-content: space-around;
    border-top: 1px solid rgba(255,255,255,0.15);
    padding-top: 16px;
  }

  .stat-item {
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .stat-value {
    font-size: 18px;
    font-weight: bold;
    color: #fff;
  }

  .stat-label {
    font-size: 12px;
    color: rgba(255,255,255,0.7);
    margin-top: 4px;
  }

  /* Section Headers */
  .section-title {
    font-size: 16px;
    font-weight: 600;
    color: var(--accent);
    margin-bottom: 12px;
    margin-top: 24px;
    display: flex;
    align-items: center;
  }

  .section-title svg {
    width: 20px;
    height: 20px;
    fill: var(--accent);
    margin-left: 8px;
  }

  /* Badges / Achievements */
  .badges-container {
    display: flex;
    overflow-x: auto;
    padding-bottom: 8px;
    margin-bottom: 8px;
    scrollbar-width: none;
    white-space: nowrap;
  }

  .badges-container::-webkit-scrollbar {
    display: none;
  }

  .badge-card {
    background-color: var(--surface-card);
    border-radius: 12px;
    padding: 14px;
    min-width: 110px;
    display: inline-flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    border: 1px solid rgba(255,255,255,0.05);
    margin-left: 12px;
    vertical-align: top;
    flex-shrink: 0;
  }

  .badge-card:first-child {
    margin-left: 0;
  }

  .badge-card.locked {
    opacity: 0.4;
    filter: grayscale(1);
  }

  .badge-icon {
    width: 48px;
    height: 48px;
    background: rgba(3, 218, 198, 0.1);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 8px;
  }

  .badge-card.locked .badge-icon {
    background: rgba(255,255,255,0.05);
  }

  .badge-icon svg {
    width: 28px;
    height: 28px;
    fill: var(--accent);
  }

  .badge-card.locked .badge-icon svg {
    fill: var(--control);
  }

  .badge-name {
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 2px;
  }

  .badge-desc {
    font-size: 10px;
    color: var(--text-muted);
  }

  /* Solved Puzzles List */
  .puzzles-list {
    display: flex;
    flex-direction: column;
  }

  .puzzle-item {
    background-color: var(--surface-card);
    border-radius: 12px;
    padding: 12px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border: 1px solid rgba(255,255,255,0.05);
    transition: background-color 0.2s;
    margin-bottom: 10px;
  }

  .puzzle-item:active {
    background-color: rgba(255,255,255,0.05);
  }

  .puzzle-info {
    display: flex;
    align-items: center;
  }

  .puzzle-thumb {
    width: 40px;
    height: 40px;
    border-radius: 8px;
    background-color: var(--surface);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    margin-left: 12px;
  }

  .puzzle-thumb img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .puzzle-details h3 {
    font-size: 14px;
    font-weight: 600;
    margin-bottom: 2px;
  }

  .puzzle-details span {
    font-size: 11px;
    color: var(--text-muted);
  }

  .puzzle-status {
    display: flex;
    align-items: center;
    font-size: 12px;
    color: var(--success);
    background: rgba(3, 218, 198, 0.1);
    padding: 4px 10px;
    border-radius: 20px;
  }

  .puzzle-status svg {
    width: 14px;
    height: 14px;
    fill: var(--success);
    margin-left: 4px;
  }

  .empty-state {
    text-align: center;
    padding: 32px 16px;
    color: var(--text-muted);
    font-size: 14px;
  }

  /* Bottom Navigation */
  .bottom-nav {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    height: calc(60px + env(safe-area-inset-bottom));
    padding-bottom: env(safe-area-inset-bottom);
    background-color: var(--surface);
    display: flex;
    justify-content: space-around;
    align-items: center;
    border-top: 1px solid rgba(255,255,255,0.08);
    z-index: 100;
  }

  .nav-item {
    flex: 1;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: var(--control);
    text-decoration: none;
    font-size: 11px;
    transition: color 0.2s;
  }

  .nav-item svg {
    width: 22px;
    height: 22px;
    fill: currentColor;
    margin-bottom: 4px;
  }

  .nav-item.active {
    color: var(--accent);
  }
</style>
<style id="rt-native">html,body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}input,textarea,select,[contenteditable],.rt-selectable,.rt-selectable *{-webkit-user-select:text;user-select:text}img,a{-webkit-user-drag:none}a,button,[role=button]{outline:none}</style>
</head>
<body>

  <!-- App Bar -->
  <header class="app-bar">
    <h1>النتائج والإنجازات</h1>
    <div class="app-bar-actions">
      <button class="icon-btn" id="resetStatsBtn" title="إعادة ضبط السجل">
        <svg viewBox="0 0 24 24"><path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
      </button>
    </div>
  </header>

  <!-- Main Container -->
  <main class="container">
    
    <!-- Overview Card -->
    <div class="overview-card">
      <div class="overview-title">إجمالي النقاط المكتسبة</div>
      <div class="overview-score" id="totalScore">0</div>
      <div class="stats-grid">
        <div class="stat-item">
          <span class="stat-value" id="solvedCount">0</span>
          <span class="stat-label">ألغاز محلولة</span>
        </div>
        <div class="stat-item">
          <span class="stat-value" id="completionRate">0%</span>
          <span class="stat-label">نسبة الإنجاز</span>
        </div>
        <div class="stat-item">
          <span class="stat-value" id="rankTitle">مبتدئ</span>
          <span class="stat-label">الرتبة</span>
        </div>
      </div>
    </div>

    <!-- Achievements Section -->
    <div class="section-title">
      <svg viewBox="0 0 24 24"><path d="M19 5h-2V3H7v2H5c-1.1 0-2 .9-2 2v1c0 2.55 1.92 4.63 4.39 4.94.63 1.5 1.98 2.63 3.61 2.96V19H7v2h10v-2h-3.00v-3.1c1.63-.33 2.98-1.46 3.61-2.96C19.08 12.63 21 10.55 21 8V7c0-1.1-.9-2-2-2zM5 8V7h2v3.82C5.84 10.4 5 9.3 5 8zm14 0c0 1.3-.84 2.4-2 2.82V7h2v1z"/></svg>
      الأوسمة والإنجازات
    </div>
    
    <div class="badges-container" id="badgesContainer">
      <!-- Injected via JS -->
    </div>

    <!-- Solved Puzzles Section -->
    <div class="section-title">
      <svg viewBox="0 0 24 24"><path d="M9 16.2L4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4L9 16.2z"/></svg>
      سجل الألغاز المحلولة
    </div>

    <div class="puzzles-list" id="puzzlesList">
      <div class="empty-state">جاري تحميل السجل...</div>
    </div>

  </main>

  <!-- Bottom Navigation -->
  <nav class="bottom-nav">
    <a href="index.html" class="nav-item">
      <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
      الرئيسية
    </a>
    <a href="scores.html" class="nav-item active">
      <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zM9 17H7v-7h2v7zm4 0h-2V7h2v10zm4 0h-2v-4h2v4z"/></svg>
      النتائج
    </a>
    <a href="overlay-guide.html" class="nav-item">
      <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V5h14v14zM7 10h2v7H7zm4-3h2v10h-2zm4 5h2v5h-2z"/></svg>
      النافذة العائمة
    </a>
  </nav>

  <script>
    (function() {
      var totalScoreEl = document.getElementById("totalScore");
      var solvedCountEl = document.getElementById("solvedCount");
      var completionRateEl = document.getElementById("completionRate");
      var rankTitleEl = document.getElementById("rankTitle");
      var badgesContainer = document.getElementById("badgesContainer");
      var puzzlesList = document.getElementById("puzzlesList");
      var resetStatsBtn = document.getElementById("resetStatsBtn");

      var badgesData = [
        { id: "first", name: "خطوة البداية", desc: "حل أول لغز", icon: '<path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/>', req: 1 },
        { id: "half", name: "مفكر نشط", desc: "حل 5 ألغاز", icon: '<path d="M12 3c-4.97 0-9 4.03-9 9 0 2.12.74 4.07 1.97 5.61L4.35 19h4.38C10.1 19.62 11.02 20 12 20c4.97 0 9-4.03 9-9s-4.03-9-9-9zm0 15c-3.31 0-6-2.69-6-6s2.69-6 6-6 6 2.69 6 6-2.69 6-6 6z"/>', req: 5 },
        { id: "master", name: "عبقري الزمان", desc: "حل جميع الألغاز", icon: '<path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/>', req: 10 }
      ];

      function loadData() {
        var solvedIds = [];
        try {
          var stored = localStorage.getItem("solved_puzzles");
          if (stored) {
            solvedIds = JSON.parse(stored);
          }
        } catch (e) {
          solvedIds = [];
        }

        fetch("games.json")
          .then(function(response) {
            return response.json();
          })
          .then(function(games) {
            renderDashboard(games, solvedIds);
          })
          .catch(function(err) {
            puzzlesList.innerHTML = '<div class="empty-state">تعذر تحميل بيانات الألغاز. تأكد من الملفات المحلية.</div>';
          });
      }

      function renderDashboard(games, solvedIds) {
        var totalGames = games.length;
        var solvedCount = solvedIds.length;
        var totalScore = solvedCount * 100;

        totalScoreEl.textContent = totalScore;
        solvedCountEl.textContent = solvedCount;

        var rate = totalGames > 0 ? Math.round((solvedCount / totalGames) * 100) : 0;
        completionRateEl.textContent = rate + "%";

        var rank = "مبتدئ";
        if (solvedCount >= 8) rank = "عبقري";
        else if (solvedCount >= 4) rank = "متوسط";
        else if (solvedCount >= 1) rank = "مفكر";
        rankTitleEl.textContent = rank;

        // Render Badges
        badgesContainer.innerHTML = "";
        for (var i = 0; i < badgesData.length; i++) {
          var b = badgesData[i];
          var isUnlocked = solvedCount >= b.req || (b.id === 'master' && totalGames > 0 && solvedCount >= totalGames);
          
          var badgeEl = document.createElement("div");
          badgeEl.className = "badge-card" + (isUnlocked ? "" : " locked");
          badgeEl.innerHTML = 
            '<div class="badge-icon">' + b.icon + '</div>' +
            '<div class="badge-name">' + b.name + '</div>' +
            '<div class="badge-desc">' + b.desc + '</div>';
          badgesContainer.appendChild(badgeEl);
        }

        // Render Solved Puzzles List
        puzzlesList.innerHTML = "";
        var solvedGamesList = [];
        for (var j = 0; j < games.length; j++) {
          if (solvedIds.indexOf(games[j].id) !== -1) {
            solvedGamesList.push(games[j]);
          }
        }

        if (solvedGamesList.length === 0) {
          puzzlesList.innerHTML = '<div class="empty-state">لم تقم بحل أي لغز بعد. اذهب إلى الرئيسية وابدأ التحدي!</div>';
          return;
        }

        for (var k = 0; k < solvedGamesList.length; k++) {
          var game = solvedGamesList[k];
          var itemEl = document.createElement("a");
          itemEl.href = "puzzle-view.html?id=" + game.id;
          itemEl.style.textDecoration = "none";
          itemEl.style.color = "inherit";
          
          var imgHtml = game.image ? '<img src="' + game.image + '" alt="">' : '<svg viewBox="0 0 24 24" style="width:20px;height:20px;fill:var(--control);"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/></svg>';

          itemEl.innerHTML = 
            '<div class="puzzle-item">' +
              '<div class="puzzle-info">' +
                '<div class="puzzle-thumb">' + imgHtml + '</div>' +
                '<div class="puzzle-details">' +
                  '<h3>' + game.title + '</h3>' +
                  '<span>الصعوبة: ' + game.difficulty + '</span>' +
                '</div>' +
              '</div>' +
              '<div class="puzzle-status">' +
                '<svg viewBox="0 0 24 24"><path d="M9 16.2L4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4L9 16.2z"/></svg>' +
                'مكتمل' +
              '</div>' +
            '</div>';
          puzzlesList.appendChild(itemEl);
        }
      }

      resetStatsBtn.addEventListener("click", function() {
        if (confirm("هل أنت متأكد من إعادة ضبط كافة النقاط وسجل الألغاز؟")) {
          try {
            localStorage.removeItem("solved_puzzles");
          } catch (e) {}
          loadData();
        }
      });

      loadData();
    })();
  </script>
</body>
</html>
