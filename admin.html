<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>لوحة التحكم</title>
<style>
:root{
  --primary:#6200EE;
  --primary-dark:#3700B3;
  --accent:#03DAC6;
  --highlight:#FFEB3B;
  --control:#B0BEC5;
  --bg:#121212;
  --surface:#1E1E1E;
  --surface-card:#252525;
  --text:#E0E0E0;
  --text-dim:#9E9E9E;
  --danger:#CF6679;
  --success:#03DAC6;
}
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,-apple-system,sans-serif;}
body{
  background-color:var(--bg);
  color:var(--text);
  padding-top:env(safe-area-inset-top);
  padding-bottom:env(safe-area-inset-bottom);
  overflow-x:hidden;
  -webkit-tap-highlight-color:transparent;
  user-select:none;
}
.rt-selectable{user-select:text;}
a{text-decoration:none;color:inherit;}

/* App Bar */
.app-bar{
  position:sticky;
  top:0;
  z-index:100;
  background-color:var(--surface);
  height:56px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 16px;
  border-bottom:1px solid #333;
}
.app-bar-title{
  font-size:18px;
  font-weight:bold;
  color:var(--text);
}
.icon-btn{
  background:none;
  border:none;
  width:44px;
  height:44px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:50%;
  cursor:pointer;
  color:var(--text);
}
.icon-btn:active{background-color:rgba(255,255,255,0.1);}
.icon-btn svg{width:24px;height:24px;fill:currentColor;}

/* Layout */
.container{
  padding:16px;
  max-width:600px;
  margin:0 auto;
  padding-bottom:80px;
}

/* Auth overlay */
.auth-overlay{
  position:fixed;
  top:0;
  left:0;
  right:0;
  bottom:0;
  background:var(--bg);
  z-index:999;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:24px;
}
.auth-card{
  background:var(--surface);
  padding:24px;
  border-radius:16px;
  width:100%;
  max-width:360px;
  box-shadow:0 8px 24px rgba(0,0,0,0.5);
  text-align:center;
}
.auth-card h2{margin-bottom:16px;color:var(--accent);}
.input-group{
  margin-bottom:16px;
  text-align:right;
}
.input-group label{
  display:block;
  margin-bottom:6px;
  font-size:14px;
  color:var(--text-dim);
}
.input-field{
  width:100%;
  height:48px;
  background:var(--surface-card);
  border:1px solid #444;
  border-radius:8px;
  color:var(--text);
  padding:0 14px;
  font-size:16px;
}
.input-field:focus{
  border-color:var(--accent);
  outline:none;
}
textarea.input-field{
  height:96px;
  padding:12px;
  resize:vertical;
}
.btn{
  width:100%;
  height:48px;
  background:var(--primary);
  color:#fff;
  border:none;
  border-radius:8px;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  margin-top:8px;
}
.btn svg {
  margin-left: 8px;
}
.btn:active{background:var(--primary-dark);}
.btn-accent{background:var(--accent);color:#000;}
.btn-accent:active{background:#02b8a7;}
.btn-danger{background:var(--danger);color:#000;}

.error-msg{
  color:var(--danger);
  font-size:13px;
  margin-top:8px;
  display:none;
}

/* Stats / Header info */
.admin-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:20px;
}
.admin-header h1{font-size:22px;}
.badge{
  background:var(--surface);
  border:1px solid var(--accent);
  color:var(--accent);
  padding:4px 12px;
  border-radius:20px;
  font-size:12px;
}

/* Puzzle List inside Admin */
.puzzle-list{
  display:flex;
  flex-direction:column;
  margin-bottom:24px;
}
.puzzle-admin-card{
  background:var(--surface);
  border-radius:12px;
  padding:14px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  border-right:4px solid var(--primary);
  margin-bottom:12px;
}
.puzzle-info h3{font-size:16px;margin-bottom:4px;}
.puzzle-info p{font-size:12px;color:var(--text-dim);}
.puzzle-actions{
  display:flex;
}
.action-icon-btn{
  background:var(--surface-card);
  border:none;
  width:40px;
  height:40px;
  border-radius:8px;
  display:flex;
  align-items:center;
  justify-content:center;
  color:var(--text);
  cursor:pointer;
  margin-left:8px;
}
.puzzle-actions .action-icon-btn:last-child {
  margin-left: 0;
}
.action-icon-btn:active{background:#333;}
.action-icon-btn.delete{color:var(--danger);}
.action-icon-btn svg{width:20px;height:20px;fill:currentColor;}

/* Modal for Add/Edit */
.modal-backdrop{
  position:fixed;
  top:0;left:0;right:0;bottom:0;
  background:rgba(0,0,0,0.7);
  z-index:200;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:16px;
  opacity:0;
  pointer-events:none;
  transition:opacity 0.2s ease;
}
.modal-backdrop.active{
  opacity:1;
  pointer-events:auto;
}
.modal{
  background:var(--surface);
  width:100%;
  max-width:480px;
  border-radius:16px;
  padding:20px;
  max-height:90vh;
  overflow-y:auto;
  box-shadow:0 10px 30px rgba(0,0,0,0.6);
}
.modal-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:16px;
}
.modal-header h3{font-size:18px;}

/* Toast notification */
.toast{
  position:fixed;
  bottom:24px;
  left:50%;
  transform:translateX(-50%) translateY(100px);
  background:var(--surface-card);
  color:var(--text);
  border:1px solid var(--accent);
  padding:12px 20px;
  border-radius:30px;
  font-size:14px;
  z-index:1000;
  transition:transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  box-shadow:0 5px 15px rgba(0,0,0,0.5);
}
.toast.show{
  transform:translateX(-50%) translateY(0);
}
</style>
<style id="rt-native">html,body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}input,textarea,select,[contenteditable],.rt-selectable,.rt-selectable *{-webkit-user-select:text;user-select:text}img,a{-webkit-user-drag:none}a,button,[role=button]{outline:none}</style>
</head>
<body>

<!-- AUTH OVERLAY -->
<div id="authOverlay" class="auth-overlay">
  <div class="auth-card">
    <div style="width:64px;height:64px;background:rgba(98,0,238,0.2);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 16px;color:var(--accent);">
      <svg style="width:32px;height:32px;fill:currentColor;" viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg>
    </div>
    <h2>لوحة تحكم المالك</h2>
    <p style="color:var(--text-dim);font-size:13px;margin-bottom:20px;">الرجاء إدخال كلمة مرور المشرف للوصول إلى إدارة الألغاز.</p>
    <div class="input-group">
      <label>كلمة المرور (تجريبي: admin)</label>
      <input type="password" id="adminPass" class="input-field" placeholder="أدخل كلمة المرور...">
    </div>
    <div id="authError" class="error-msg">كلمة المرور غير صحيحة</div>
    <button class="btn btn-accent" id="loginBtn">تسجيل الدخول</button>
    <a href="index.html" style="display:block;margin-top:16px;color:var(--text-dim);font-size:13px;">العودة للرئيسية</a>
  </div>
</div>

<!-- APP BAR -->
<div class="app-bar">
  <div style="display:flex;align-items:center;">
    <a href="index.html" class="icon-btn" aria-label="الرئيسية" style="margin-left:12px;">
      <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
    </a>
    <span class="app-bar-title">لوحة التحكم</span>
  </div>
  <button class="icon-btn" id="addNewBtn" aria-label="إضافة لغز جديد">
    <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
  </button>
</div>

<!-- MAIN CONTAINER -->
<div class="container">
  <div class="admin-header">
    <h1>إدارة الألغاز</h1>
    <span class="badge" id="puzzleCount">0 لغز</span>
  </div>

  <div class="puzzle-list" id="puzzleListContainer">
    <!-- Loaded dynamically -->
  </div>
</div>

<!-- ADD/EDIT MODAL -->
<div class="modal-backdrop" id="puzzleModal">
  <div class="modal">
    <div class="modal-header">
      <h3 id="modalTitle">إضافة لغز جديد</h3>
      <button class="icon-btn" id="closeModalBtn">
        <svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
      </button>
    </div>
    
    <input type="hidden" id="editPuzzleId">

    <div class="input-group">
      <label>عنوان اللغز</label>
      <input type="text" id="pTitle" class="input-field rt-selectable" placeholder="مثال: لغز الكرات الملونة">
    </div>

    <div class="input-group">
      <label>الوصف</label>
      <textarea id="pDesc" class="input-field rt-selectable" placeholder="وصف قصير للغز أو طريقة اللعب..."></textarea>
    </div>

    <div class="input-group">
      <label>مستوى الصعوبة</label>
      <select id="pDiff" class="input-field">
        <option value="سهل">سهل</option>
        <option value="متوسط">متوسط</option>
        <option value="صعب">صعب</option>
        <option value="خبير">خبير</option>
      </select>
    </div>

    <div class="input-group">
      <label>الحل (الإجابة الصحيحة)</label>
      <input type="text" id="pAnswer" class="input-field rt-selectable" placeholder="الإجابة...">
    </div>

    <div class="input-group">
      <label>رمز SVG (اختياري)</label>
      <input type="text" id="pSvg" class="input-field rt-selectable" placeholder="<svg>...</svg> أو رابط بيانات">
    </div>

    <button class="btn btn-accent" id="savePuzzleBtn">حفظ اللغز</button>
  </div>
</div>

<!-- TOAST -->
<div class="toast" id="toast">تم الحفظ بنجاح</div>

<script>
(function(){
  var authOverlay = document.getElementById('authOverlay');
  var adminPass = document.getElementById('adminPass');
  var loginBtn = document.getElementById('loginBtn');
  var authError = document.getElementById('authError');
  
  var puzzleListContainer = document.getElementById('puzzleListContainer');
  var puzzleCount = document.getElementById('puzzleCount');
  
  var puzzleModal = document.getElementById('puzzleModal');
  var closeModalBtn = document.getElementById('closeModalBtn');
  var addNewBtn = document.getElementById('addNewBtn');
  var savePuzzleBtn = document.getElementById('savePuzzleBtn');
  var modalTitle = document.getElementById('modalTitle');
  
  var editPuzzleId = document.getElementById('editPuzzleId');
  var pTitle = document.getElementById('pTitle');
  var pDesc = document.getElementById('pDesc');
  var pDiff = document.getElementById('pDiff');
  var pAnswer = document.getElementById('pAnswer');
  var pSvg = document.getElementById('pSvg');
  var toast = document.getElementById('toast');

  var gamesData = [];

  // Check auth session
  try {
    if (localStorage.getItem('admin_auth') === 'true') {
      authOverlay.style.display = 'none';
      loadGames();
    }
  } catch(e) {}

  loginBtn.addEventListener('click', function(){
    if (adminPass.value === 'admin') {
      try {
        localStorage.setItem('admin_auth', 'true');
      } catch(e) {}
      authOverlay.style.display = 'none';
      loadGames();
    } else {
      authError.style.display = 'block';
    }
  });

  function showToast(msg) {
    toast.textContent = msg;
    toast.classList.add('show');
    setTimeout(function(){
      toast.classList.remove('show');
    }, 2500);
  }

  function loadGames() {
    fetch('games.json')
      .then(function(res){
        return res.json();
      })
      .then(function(data){
        gamesData = data;
        renderList();
      })
      .catch(function(err){
        puzzleListContainer.innerHTML = '<div style="text-align:center;color:var(--danger);padding:20px;">تعذر تحميل بيانات games.json تأكد من وجود الملف.</div>';
      });
  }

  function renderList() {
    puzzleListContainer.innerHTML = '';
    puzzleCount.textContent = gamesData.length + ' لغز';
    
    for (var i = 0; i < gamesData.length; i++) {
      var item = gamesData[i];
      
      var card = document.createElement('div');
      card.className = 'puzzle-admin-card';
      
      var info = document.createElement('div');
      info.className = 'puzzle-info';
      
      var h3 = document.createElement('h3');
      h3.className = 'rt-selectable';
      h3.textContent = item.title;
      
      var p = document.createElement('p');
      p.className = 'rt-selectable';
      p.textContent = 'الصعوبة: ' + item.difficulty + ' | الحل: ' + (item.answer || 'غير متوفر');
      
      info.appendChild(h3);
      info.appendChild(p);
      card.appendChild(info);
      
      var actions = document.createElement('div');
      actions.className = 'puzzle-actions';
      
      // Edit button
      var editBtn = document.createElement('button');
      editBtn.className = 'action-icon-btn';
      editBtn.innerHTML = '<svg viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>';
      (function(gameItem){
        editBtn.addEventListener('click', function(){
          openEditModal(gameItem);
        });
      })(item);
      
      // Delete button
      var delBtn = document.createElement('button');
      delBtn.className = 'action-icon-btn delete';
      delBtn.innerHTML = '<svg viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>';
      (function(gameId){
        delBtn.addEventListener('click', function(){
          deleteGame(gameId);
        });
      })(item.id);
      
      actions.appendChild(editBtn);
      actions.appendChild(delBtn);
      card.appendChild(actions);
      
      puzzleListContainer.appendChild(card);
    }
  }

  function openEditModal(item) {
    modalTitle.textContent = 'تعديل اللغز';
    editPuzzleId.value = item.id;
    pTitle.value = item.title || '';
    pDesc.value = item.description || '';
    pDiff.value = item.difficulty || 'سهل';
    pAnswer.value = item.answer || '';
    pSvg.value = item.image || '';
    puzzleModal.classList.add('active');
  }

  addNewBtn.addEventListener('click', function(){
    modalTitle.textContent = 'إضافة لغز جديد';
    editPuzzleId.value = '';
    pTitle.value = '';
    pDesc.value = '';
    pDiff.value = 'سهل';
    pAnswer.value = '';
    pSvg.value = '';
    puzzleModal.classList.add('active');
  });

  closeModalBtn.addEventListener('click', function(){
    puzzleModal.classList.remove('active');
  });

  savePuzzleBtn.addEventListener('click', function(){
    var idVal = editPuzzleId.value;
    var titleVal = pTitle.value.trim();
    
    if (!titleVal) {
      showToast('الرجاء إدخال عنوان اللغز');
      return;
    }

    if (idVal) {
      // Edit existing
      for (var i = 0; i < gamesData.length; i++) {
        if (gamesData[i].id === idVal) {
          gamesData[i].title = titleVal;
          gamesData[i].description = pDesc.value.trim();
          gamesData[i].difficulty = pDiff.value;
          gamesData[i].answer = pAnswer.value.trim();
          gamesData[i].image = pSvg.value.trim();
          break;
        }
      }
      showToast('تم تعديل اللغز بنجاح');
    } else {
      // Add new
      var newObj = {
        id: 'puzzle_' + Date.now(),
        title: titleVal,
        description: pDesc.value.trim(),
        difficulty: pDiff.value,
        answer: pAnswer.value.trim(),
        image: pSvg.value.trim() || '<svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/></svg>'
      };
      gamesData.push(newObj);
      showToast('تم إضافة اللغز بنجاح');
    }

    puzzleModal.classList.remove('active');
    renderList();
    try {
      localStorage.setItem('games_override', JSON.stringify(gamesData));
    } catch(e){}
  });

  function deleteGame(id) {
    if (confirm('هل أنت متأكد من حذف هذا اللغز؟')) {
      var newArr = [];
      for (var i = 0; i < gamesData.length; i++) {
        if (gamesData[i].id !== id) {
          newArr.push(gamesData[i]);
        }
      }
      gamesData = newArr;
      renderList();
      showToast('تم الحذف بنجاح');
      try {
        localStorage.setItem('games_override', JSON.stringify(gamesData));
      } catch(e){}
    }
  }

})();
</script>
</body>
</html>
