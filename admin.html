<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>لوحة المالك</title>
<script src="rostrick-admin.js"></script>
<style>
:root {
  --primary: #1A1A2E;
  --primary-dark: #16213E;
  --accent: #0F3460;
  --highlight: #E94560;
  --control: #FFFFFF;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: system-ui, -apple-system, sans-serif;
  -webkit-tap-highlight-color: transparent;
}

body {
  background-color: var(--primary);
  color: var(--control);
  min-height: 100vh;
  padding-top: env(safe-area-inset-top);
  padding-bottom: env(safe-area-inset-bottom);
  display: flex;
  flex-direction: column;
}

/* Disable selection except where needed */
body {
  -webkit-user-select: none;
  user-select: none;
}
.rt-selectable {
  -webkit-user-select: text;
  user-select: text;
}

/* Header */
.app-header {
  background-color: var(--primary-dark);
  padding: 16px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid rgba(255,255,255,0.08);
  position: sticky;
  top: 0;
  z-index: 10;
}

.app-title {
  font-size: 18px;
  font-weight: 700;
  display: flex;
  align-items: center;
}

.app-title svg {
  width: 24px;
  height: 24px;
  fill: var(--highlight);
  margin-left: 10px;
}

.btn-icon {
  background: none;
  border: none;
  color: var(--control);
  width: 44px;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 50%;
  cursor: pointer;
  transition: background 0.2s;
  text-decoration: none;
}

.btn-icon:active {
  background: rgba(255,255,255,0.1);
}

.btn-icon svg {
  width: 22px;
  height: 22px;
  fill: currentColor;
}

/* Main Container */
.container {
  padding: 20px;
  flex: 1;
  display: flex;
  flex-direction: column;
  max-width: 600px;
  width: 100%;
  margin: 0 auto;
}

/* Login Form */
.login-card {
  background-color: var(--primary-dark);
  border-radius: 16px;
  padding: 24px;
  margin-top: 20px;
  border: 1px solid rgba(255,255,255,0.08);
}

.form-group {
  margin-bottom: 18px;
}

.form-label {
  display: block;
  font-size: 14px;
  margin-bottom: 8px;
  color: rgba(255,255,255,0.8);
}

.form-input {
  width: 100%;
  height: 48px;
  background-color: var(--primary);
  border: 1px solid rgba(255,255,255,0.15);
  border-radius: 12px;
  padding: 0 16px;
  color: var(--control);
  font-size: 15px;
}

.form-input:focus {
  outline: none;
  border-color: var(--highlight);
}

textarea.form-input {
  height: 100px;
  padding: 12px 16px;
  resize: vertical;
}

.btn {
  width: 100%;
  height: 48px;
  background-color: var(--highlight);
  color: var(--control);
  border: none;
  border-radius: 12px;
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: opacity 0.2s;
}

.btn svg {
  width: 20px;
  height: 20px;
  fill: currentColor;
  margin-left: 8px;
}

.btn:active {
  opacity: 0.85;
}

.btn-secondary {
  background-color: var(--accent);
}

.info-text {
  font-size: 13px;
  color: rgba(255,255,255,0.5);
  margin-top: 12px;
  line-height: 1.5;
}

/* Editor View */
.editor-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 20px;
}

.item-list {
  display: flex;
  flex-direction: column;
  margin-bottom: 90px;
}

.item-card {
  background-color: var(--primary-dark);
  border-radius: 14px;
  padding: 16px;
  display: flex;
  align-items: center;
  border: 1px solid rgba(255,255,255,0.06);
  margin-bottom: 12px;
}

.item-thumb {
  width: 50px;
  height: 50px;
  border-radius: 10px;
  object-fit: cover;
  background-color: var(--accent);
  flex-shrink: 0;
  margin-left: 14px;
}

.item-details {
  flex: 1;
  min-width: 0;
}

.item-name {
  font-size: 16px;
  font-weight: 600;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  margin-bottom: 4px;
}

.item-meta {
  font-size: 12px;
  color: rgba(255,255,255,0.5);
}

.item-actions {
  display: flex;
  margin-right: 14px;
}

.btn-sm {
  width: 38px;
  height: 38px;
  border-radius: 10px;
  background-color: var(--accent);
  border: none;
  color: var(--control);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  margin-left: 8px;
}

.btn-sm:last-child {
  margin-left: 0;
}

.btn-sm svg {
  width: 18px;
  height: 18px;
  fill: currentColor;
}

.btn-sm.danger {
  background-color: rgba(233, 69, 96, 0.2);
  color: var(--highlight);
}

/* Floating Action Bar */
.floating-bar {
  position: fixed;
  bottom: calc(20px + env(safe-area-inset-bottom));
  left: 20px;
  right: 20px;
  max-width: 560px;
  margin: 0 auto;
  background-color: var(--primary-dark);
  border-radius: 16px;
  padding: 12px;
  display: flex;
  border: 1px solid rgba(255,255,255,0.1);
  box-shadow: 0 10px 25px rgba(0,0,0,0.5);
  z-index: 10;
}

.floating-bar .btn {
  flex: 1;
  margin-left: 8px;
}

.floating-bar .btn:last-child {
  margin-left: 0;
}

/* Modal */
.modal {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background-color: rgba(0,0,0,0.8);
  z-index: 100;
  display: none;
  align-items: flex-end;
  justify-content: center;
}

.modal.active {
  display: flex;
}

.modal-content {
  background-color: var(--primary-dark);
  width: 100%;
  max-width: 600px;
  max-height: 90vh;
  border-radius: 20px 20px 0 0;
  padding: 24px;
  overflow-y: auto;
  border-top: 1px solid rgba(255,255,255,0.1);
  animation: slideUp 0.3s ease;
}

@keyframes slideUp {
  from { transform: translateY(100%); }
  to { transform: translateY(0); }
}

.modal-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 20px;
}

.image-picker-container {
  display: flex;
  align-items: center;
  margin-bottom: 18px;
}

.preview-img {
  width: 70px;
  height: 70px;
  border-radius: 14px;
  object-fit: cover;
  background-color: var(--accent);
  border: 1px solid rgba(255,255,255,0.1);
  margin-left: 16px;
}

.toast {
  position: fixed;
  top: 20px;
  left: 50%;
  transform: translateX(-50%) translateY(-100px);
  background-color: #10b981;
  color: white;
  padding: 12px 24px;
  border-radius: 12px;
  font-weight: 600;
  transition: transform 0.3s ease;
  z-index: 1000;
  box-shadow: 0 5px 15px rgba(0,0,0,0.3);
}

.toast.error {
  background-color: var(--highlight);
}

.toast.active {
  transform: translateX(-50%) translateY(0);
}
</style>
<style id="rt-native">html,body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}input,textarea,select,[contenteditable],.rt-selectable,.rt-selectable *{-webkit-user-select:text;user-select:text}img,a{-webkit-user-drag:none}a,button,[role=button]{outline:none}</style>
</head>
<body>

  <header class="app-header">
    <div class="app-title">
      <svg viewBox="0 0 24 24"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11v8.8z"/></svg>
      لوحة المالك
    </div>
    <a href="home.html" class="btn-icon" title="الرئيسية">
      <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
    </a>
  </header>

  <div class="container" id="app-container">
    <!-- Dynamic content injected here -->
  </div>

  <div id="toast" class="toast">تم الحفظ بنجاح</div>

  <!-- Edit Modal -->
  <div class="modal" id="edit-modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="modal-title">تعديل العنصر</h3>
        <button class="btn-icon" onclick="closeModal()">
          <svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
        </button>
      </div>
      <form id="item-form" onsubmit="saveItem(event)">
        <div class="image-picker-container">
          <img id="edit-img-preview" class="preview-img" src="" alt="معاينة">
          <div>
            <label class="form-label">صورة الغلاف</label>
            <input type="file" id="image-file-input" accept="image/*" style="display:none" onchange="handleImagePick(event)">
            <button type="button" class="btn btn-secondary" style="height:38px; padding:0 16px; font-size:14px;" onclick="document.getElementById('image-file-input').click()">اختيار صورة</button>
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">عنوان اللعبة / اللغز</label>
          <input type="text" id="edit-title" class="form-input" required>
        </div>
        <div class="form-group">
          <label class="form-label">التصنيف</label>
          <input type="text" id="edit-category" class="form-input" required>
        </div>
        <div class="form-group">
          <label class="form-label">النوع (type)</label>
          <input type="text" id="edit-type" class="form-input" required>
        </div>
        <div class="form-group">
          <label class="form-label">الوصف</label>
          <textarea id="edit-desc" class="form-input" required></textarea>
        </div>
        <div style="display:flex;">
          <div class="form-group" style="flex:1; margin-left:12px;">
            <label class="form-label">عدد مرات اللعب</label>
            <input type="number" id="edit-plays" class="form-input" required>
          </div>
          <div class="form-group" style="flex:1;">
            <label class="form-label">التقييم</label>
            <input type="number" step="0.1" max="5" min="0" id="edit-rating" class="form-input" required>
          </div>
        </div>
        <button type="submit" class="btn" style="width:100%;">حفظ التغييرات</button>
      </form>
    </div>
  </div>

<script>
let gamesData = [];
let fileSha = null;
let currentEditingIndex = null;
let currentImageData = '';

function showToast(message, isError) {
  var toast = document.getElementById('toast');
  toast.textContent = message;
  toast.className = 'toast ' + (isError ? 'error ' : '') + 'active';
  setTimeout(function() {
    toast.className = 'toast';
  }, 3000);
}

function renderLogin() {
  var container = document.getElementById('app-container');
  container.innerHTML = `
    <div class="login-card">
      <h2 style="margin-bottom: 8px; font-size:20px;">تسجيل دخول المالك</h2>
      <p class="info-text" style="margin-top:0; margin-bottom:20px;">أدخل بيانات مستودع GitHub الخاص بك للوصول إلى إدارة محتوى الألعاب.</p>
      <form onsubmit="handleLogin(event)">
        <div class="form-group">
          <label class="form-label">اسم المستخدم (GitHub Username)</label>
          <input type="text" id="gh-user" class="form-input" required autocomplete="username">
        </div>
        <div class="form-group">
          <label class="form-label">اسم المستودع (Repository Name)</label>
          <input type="text" id="gh-repo" class="form-input" required>
        </div>
        <div class="form-group">
          <label class="form-label">رمز الوصول (Fine-grained Token)</label>
          <input type="password" id="gh-token" class="form-input" required autocomplete="current-password">
          <div class="info-text">يجب أن يمتلك الرمز صلاحيات القراءة والكتابة (Contents: read & write) على هذا المستودع فقط.</div>
        </div>
        <button type="submit" class="btn" style="width:100%;">دخول للوحة التحكم</button>
      </form>
    </div>
  `;
}

function handleLogin(e) {
  e.preventDefault();
  var user = document.getElementById('gh-user').value.trim();
  var repo = document.getElementById('gh-repo').value.trim();
  var token = document.getElementById('gh-token').value.trim();

  window.RTAdmin.login(user, repo, token).then(function() {
    loadGamesData();
  }).catch(function(err) {
    showToast('فشل تسجيل الدخول. تحقق من البيانات وصلاحيات الرمز.', true);
  });
}

function loadGamesData() {
  window.RTAdmin.readJson('games.json').then(function(res) {
    gamesData = res.data || [];
    fileSha = res.sha;
    renderEditor();
  }).catch(function(err) {
    showToast('حدث خطأ أثناء تحميل ملف games.json', true);
    renderEditor();
  });
}

function renderEditor() {
  var container = document.getElementById('app-container');
  var itemsHtml = '';
  
  for (var i = 0; i < gamesData.length; i++) {
    var game = gamesData[i];
    itemsHtml += `
      <div class="item-card">
        <img class="item-thumb" src="${game.image || ''}" alt="">
        <div class="item-details">
          <div class="item-name rt-selectable">${game.title}</div>
          <div class="item-meta">${game.category} • ${game.plays} لعب • <svg viewBox="0 0 24 24" style="width:12px;height:12px;fill:#fbbf24;vertical-align:middle;display:inline-block;"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg> ${game.rating}</div>
        </div>
        <div class="item-actions">
          <button class="btn-sm" onclick="openEditModal(${i})">
            <svg viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>
          </button>
          <button class="btn-sm danger" onclick="deleteItem(${i})">
            <svg viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>
          </button>
        </div>
      </div>
    `;
  }

  container.innerHTML = `
    <div class="editor-header">
      <h2 style="font-size:18px;">إدارة الألعاب والألغاز</h2>
      <button class="btn-secondary" style="height:36px; padding:0 14px; border-radius:10px; border:none; color:white; font-weight:600; cursor:pointer;" onclick="logout()">تسجيل خروج</button>
    </div>
    <div class="item-list">
      ${itemsHtml.length > 0 ? itemsHtml : '<p class="info-text" style="text-align:center; padding:40px 0;">لا توجد عناصر مضافة حالياً.</p>'}
    </div>
    <div class="floating-bar">
      <button class="btn" onclick="openAddModal()">إضافة لعبة / لغز جديد</button>
      <button class="btn btn-secondary" onclick="saveAllChanges()">حفظ في المستودع</button>
    </div>
  `;
}

function logout() {
  try {
    window.RTAdmin.logout();
  } catch(e) {}
  renderLogin();
}

function openAddModal() {
  currentEditingIndex = null;
  document.getElementById('modal-title').textContent = 'إضافة لعبة جديدة';
  document.getElementById('edit-title').value = '';
  document.getElementById('edit-category').value = '';
  document.getElementById('edit-type').value = 'puzzle-game';
  document.getElementById('edit-desc').value = '';
  document.getElementById('edit-plays').value = '100';
  document.getElementById('edit-rating').value = '4.5';
  currentImageData = '';
  document.getElementById('edit-img-preview').src = '';
  document.getElementById('edit-modal').classList.add('active');
}

function openEditModal(index) {
  currentEditingIndex = index;
  var game = gamesData[index];
  document.getElementById('modal-title').textContent = 'تعديل العنصر';
  document.getElementById('edit-title').value = game.title || '';
  document.getElementById('edit-category').value = game.category || '';
  document.getElementById('edit-type').value = game.type || '';
  document.getElementById('edit-desc').value = game.description || '';
  document.getElementById('edit-plays').value = game.plays || 0;
  document.getElementById('edit-rating').value = game.rating || 5.0;
  currentImageData = game.image || '';
  document.getElementById('edit-img-preview').src = currentImageData;
  document.getElementById('edit-modal').classList.add('active');
}

function closeModal() {
  document.getElementById('edit-modal').classList.remove('active');
}

function handleImagePick(e) {
  var file = e.target.files[0];
  if (!file) return;
  window.RTAdmin.imageToDataUrl(file, 480, 0.7).then(function(dataUrl) {
    currentImageData = dataUrl;
    document.getElementById('edit-img-preview').src = dataUrl;
  }).catch(function(err) {
    showToast('فشل معالجة الصورة', true);
  });
}

function saveItem(e) {
  e.preventDefault();
  var newItem = {
    id: currentEditingIndex !== null ? gamesData[currentEditingIndex].id : 'game-' + Date.now(),
    title: document.getElementById('edit-title').value.trim(),
    description: document.getElementById('edit-desc').value.trim(),
    category: document.getElementById('edit-category').value.trim(),
    type: document.getElementById('edit-type').value.trim(),
    plays: parseInt(document.getElementById('edit-plays').value, 10) || 0,
    rating: parseFloat(document.getElementById('edit-rating').value) || 5.0,
    image: currentImageData
  };

  if (currentEditingIndex !== null) {
    var existing = gamesData[currentEditingIndex];
    for (var key in existing) {
      if (newItem[key] === undefined) {
        newItem[key] = existing[key];
      }
    }
    gamesData[currentEditingIndex] = newItem;
  } else {
    gamesData.push(newItem);
  }

  closeModal();
  renderEditor();
}

function deleteItem(index) {
  if (confirm('هل أنت متأكد من حذف هذا العنصر؟')) {
    gamesData.splice(index, 1);
    renderEditor();
  }
}

function saveAllChanges() {
  window.RTAdmin.writeJson('games.json', gamesData, fileSha).then(function(res) {
    fileSha = res.sha;
    showToast('تم الحفظ وتحديث التطبيق بنجاح', false);
  }).catch(function(err) {
    showToast('فشل الحفظ في المستودع: ' + (err.message || ''), true);
  });
}

// Init
try {
  if (window.RTAdmin.isLoggedIn()) {
    loadGamesData();
  } else {
    renderLogin();
  }
} catch(e) {
  renderLogin();
}
</script>
</body>
</html>
