<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مكتبة الألعاب المتواضعة - التصنيفات</title>
<style>
:root {
  --primary: #6200EE;
  --primary-dark: #3700B3;
  --accent: #03DAC6;
  --highlight: #FF0266;
  --control: #B0BEC5;
  --bg: #121212;
  --surface: #1E1E1E;
  --text: #E0E0E0;
  --text-muted: #9E9E9E;
  --card-bg: #2A2A2A;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: Tahoma, Arial, sans-serif;
  -webkit-tap-highlight-color: transparent;
}

body {
  background-color: var(--bg);
  color: var(--text);
  padding-bottom: 70px;
}

header {
  background-color: var(--surface);
  padding: 16px;
  text-align: center;
  border-bottom: 1px solid #333;
  position: sticky;
  top: 0;
  z-index: 100;
}

header h1 {
  font-size: 1.2rem;
  color: var(--accent);
}

.container {
  padding: 16px;
  max-width: 600px;
  margin: 0 auto;
}

.search-box {
  width: 100%;
  padding: 12px 16px;
  background-color: var(--card-bg);
  border: 1px solid #444;
  border-radius: 8px;
  color: var(--text);
  font-size: 1rem;
  margin-bottom: 16px;
  outline: none;
}

.search-box:focus {
  border-color: var(--accent);
}

.chips-container {
  display: flex;
  overflow-x: auto;
  padding-bottom: 8px;
  margin-bottom: 16px;
}

.chips-container::-webkit-scrollbar {
  display: none;
}

.chip {
  background-color: var(--card-bg);
  color: var(--text);
  border: 1px solid #444;
  padding: 8px 16px;
  border-radius: 20px;
  white-space: nowrap;
  margin-left: 8px;
  cursor: pointer;
  font-size: 0.9rem;
  min-height: 44px;
  display: flex;
  align-items: center;
}

.chip.active {
  background-color: var(--primary);
  border-color: var(--primary);
  color: #fff;
}

.section-title {
  font-size: 1.1rem;
  margin-bottom: 12px;
  color: var(--accent);
}

.games-list {
  display: flex;
  flex-direction: column;
}

.game-card {
  background-color: var(--card-bg);
  border-radius: 8px;
  padding: 12px;
  margin-bottom: 12px;
  display: flex;
  align-items: center;
  text-decoration: none;
  color: var(--text);
  border: 1px solid #333;
  min-height: 44px;
}

.game-icon {
  width: 56px;
  height: 56px;
  background-color: var(--surface);
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  margin-left: 12px;
  color: var(--accent);
}

.game-info {
  flex-grow: 1;
}

.game-title {
  font-size: 1rem;
  font-weight: bold;
  margin-bottom: 4px;
}

.game-category {
  font-size: 0.8rem;
  color: var(--text-muted);
}

.game-action {
  background-color: var(--primary);
  color: #fff;
  border: none;
  padding: 8px 12px;
  border-radius: 6px;
  font-size: 0.85rem;
  cursor: pointer;
}

.empty-state {
  text-align: center;
  padding: 40px 20px;
  color: var(--text-muted);
}

nav {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background-color: var(--surface);
  display: flex;
  justify-content: space-around;
  padding: 8px 0;
  border-top: 1px solid #333;
  z-index: 100;
}

.nav-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  text-decoration: none;
  color: var(--text-muted);
  font-size: 0.75rem;
  width: 25%;
  min-height: 44px;
  justify-content: center;
}

.nav-item svg {
  width: 24px;
  height: 24px;
  margin-bottom: 4px;
  fill: currentColor;
}

.nav-item.active {
  color: var(--accent);
}
</style>
</head>
<body>

<header>
  <h1>التصنيفات</h1>
</header>

<div class="container">
  <input type="text" id="searchInput" class="search-box" placeholder="ابحث في التصنيفات والألعاب...">

  <div class="chips-container" id="chipsContainer">
    <div class="chip active" data-category="الكل">الكل</div>
    <div class="chip" data-category="الحركة">الحركة</div>
    <div class="chip" data-category="الألغاز">الألغاز</div>
    <div class="chip" data-category="المغامرة">المغامرة</div>
    <div class="chip" data-category="الرياضة">الرياضة</div>
    <div class="chip" data-category="الاستراتيجية">الاستراتيجية</div>
  </div>

  <div class="section-title" id="sectionTitle">جميع الألعاب</div>
  <div class="games-list" id="gamesList"></div>
</div>

<nav>
  <a href="index.html" class="nav-item">
    <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
    الرئيسية
  </a>
  <a href="categories.html" class="nav-item active">
    <svg viewBox="0 0 24 24"><path d="M4 11h5V5H4v6zm0 7h5v-6H4v6zm6 0h5v-6h-5v6zm6 0h5v-6h-5v6zm-6-7h5V5h-5v6zm6-6v6h5V5h-5z"/></svg>
    التصنيفات
  </a>
  <a href="favorites.html" class="nav-item">
    <svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
    المفضلة
  </a>
  <a href="settings.html" class="nav-item">
    <svg viewBox="0 0 24 24"><path d="M19.43 12.98c.04-.32.07-.64.07-.98s-.03-.66-.07-.98l2.11-1.65c.19-.15.24-.42.12-.64l-2-3.46c-.12-.22-.39-.3-.61-.22l-2.49 1c-.52-.4-1.08-.73-1.69-.98l-.38-2.65C14.03 2.18 13.82 2 13.6 2h-4c-.22 0-.42.18-.45.42l-.38 2.65c-.61.25-1.17.59-1.69.98l-2.49-1c-.23-.09-.49 0-.61.22l-2 3.46c-.13.22-.07.49.12.64l2.11 1.65c-.04.32-.07.65-.07.98s.03.66.07.98l-2.11 1.65c-.19.15-.24.42-.12.64l2 3.46c.12.22.39.3.61.22l2.49-1c.52.4 1.08.73 1.69.98l.38 2.65c.03.24.23.42.45.42h4c.22 0 .42-.18.45-.42l.38-2.65c.61-.25 1.17-.59 1.69-.98l2.49 1c.23.09.49 0 .61-.22l2-3.46c.12-.22.07-.49-.12-.64l-2.11-1.65zM12 15.5c-1.93 0-3.5-1.57-3.5-3.5s1.57-3.5 3.5-3.5 3.5 1.57 3.5 3.5-1.57 3.5-3.5 3.5z"/></svg>
    الإعدادات
  </a>
</nav>

<script>
var gamesData = [
  { id: 1, title: "المقاتل الأسطوري", category: "الحركة", icon: '<svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor"><path d="M7 2v11h3v9l7-12h-4l4-8z"/></svg>' },
  { id: 2, title: "لغز المتاهة", category: "الألغاز", icon: '<svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 17h-2v-2h2v2zm2.07-7.75l-.9.92C13.45 12.9 13 13.5 13 15h-2v-.5c0-1.1.45-2.1 1.17-2.83l1.24-1.26c.37-.36.59-.86.59-1.41 0-1.1-.9-2-2-2s-2 .9-2 2H7c0-2.76 2.24-5 5-5s5 2.24 5 5c0 1.02-.42 1.95-1.07 2.75z"/></svg>' },
  { id: 3, title: "رحلة الصحراء", category: "المغامرة", icon: '<svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor"><path d="M14 6l-3.75 5 2.85 3.8-1.6 1.2C10.51 14.9 9 13 9 13L3 21h18L14 6z"/></svg>' },
  { id: 4, title: "بطولة الكأس", category: "الرياضة", icon: '<svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor"><path d="M19 5h-2V3H7v2H5c-1.1 0-2 .9-2 2v1c0 2.55 1.92 4.63 4.4 5.03 1.53 1.04 3.39 1.74 5.6 1.97V19H9v2h6v-2h-3v-3.97c2.21-.23 4.07-.93 5.6-1.97 2.48-.4 4.4-2.48 4.4-5.03V7c0-1.1-.9-2-2-2zM5 8h2v3.02C5.84 10.74 5 9.47 5 8zm14 3c0 1.47-.84 2.74-2 3.02V8h2v3z"/></svg>' },
  { id: 5, title: "المملكة الذكية", category: "الاستراتيجية", icon: '<svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>' },
  { id: 6, title: "ظل النينجا", category: "الحركة", icon: '<svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm-1-13h2v6h-2zm0 8h2v2h-2z"/></svg>' }
];

var selectedCategory = "الكل";
var searchQuery = "";

function renderGames() {
  var listEl = document.getElementById("gamesList");
  var titleEl = document.getElementById("sectionTitle");
  listEl.innerHTML = "";

  titleEl.innerHTML = selectedCategory === "الكل" ? "جميع الألعاب" : "تصنيف: " + selectedCategory;

  var filtered = [];
  var i = 0;
  for (i = 0; i < gamesData.length; i++) {
    var game = gamesData[i];
    var matchCat = (selectedCategory === "الكل" || game.category === selectedCategory);
    var matchQuery = game.title.indexOf(searchQuery) !== -1 || game.category.indexOf(searchQuery) !== -1;
    if (matchCat && matchQuery) {
      filtered.push(game);
    }
  }

  if (filtered.length === 0) {
    listEl.innerHTML = '<div class="empty-state">لا توجد ألعاب مطابقة للبحث أو التصنيف</div>';
    return;
  }

  for (i = 0; i < filtered.length; i++) {
    var g = filtered[i];
    var a = document.createElement("a");
    a.className = "game-card";
    a.href = "game-details.html?id=" + g.id;

    var iconDiv = document.createElement("div");
    iconDiv.className = "game-icon";
    iconDiv.innerHTML = g.icon;

    var infoDiv = document.createElement("div");
    infoDiv.className = "game-info";

    var titleDiv = document.createElement("div");
    titleDiv.className = "game-title";
    titleDiv.textContent = g.title;

    var catDiv = document.createElement("div");
    catDiv.className = "game-category";
    catDiv.textContent = g.category;

    infoDiv.appendChild(titleDiv);
    infoDiv.appendChild(catDiv);

    var btn = document.createElement("button");
    btn.className = "game-action";
    btn.textContent = "عرض";
    
    // Prevent card navigation conflict
    btn.onclick = function(e) {
      e.preventDefault();
      window.location.href = this.getAttribute('data-href');
    };
    btn.setAttribute('data-href', 'game-details.html?id=' + g.id);

    a.appendChild(iconDiv);
    a.appendChild(infoDiv);
    a.appendChild(btn);

    listEl.appendChild(a);
  }
}

document.getElementById("searchInput").addEventListener("input", function(e) {
  searchQuery = e.target.value.trim();
  renderGames();
});

var chips = document.querySelectorAll(".chip");
var c = 0;
for (c = 0; c < chips.length; c++) {
  chips[c].addEventListener("click", function() {
    var activeChips = document.querySelectorAll(".chip.active");
    var k = 0;
    for (k = 0; k < activeChips.length; k++) {
      activeChips[k].className = "chip";
    }
    this.className = "chip active";
    selectedCategory = this.getAttribute("data-category");
    renderGames();
  });
}

renderGames();
</script>

</body>
</html>
