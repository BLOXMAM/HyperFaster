<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>مكتبة الألعاب</title>
<style>
:root {
  --primary: #1A1A2E;
  --primary-dark: #16213E;
  --accent: #0F3460;
  --highlight: #E94560;
  --control: #FFFFFF;
  --text-muted: #A0A0B2;
  --card-bg: #1F2238;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: system-ui, -apple-system, sans-serif;
  -webkit-tap-highlight-color: transparent;
}

body {
  background-color: var(--primary);
  color: var(--control);
  padding-top: env(safe-area-inset-top);
  padding-bottom: env(safe-area-inset-bottom);
  display: flex;
  flex-direction: column;
  height: 100vh;
  height: 100dvh;
  overflow: hidden;
}

/* App Header */
.app-header {
  background-color: var(--primary-dark);
  padding: 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid rgba(255,255,255,0.05);
  flex-shrink: 0;
}

.app-header h1 {
  font-size: 1.2rem;
  font-weight: 700;
  color: var(--control);
}

.back-btn {
  background: none;
  border: none;
  color: var(--control);
  width: 44px;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 50%;
  cursor: pointer;
  transition: background 0.2s;
}

.back-btn:active {
  background: rgba(255,255,255,0.1);
}

.back-btn svg {
  width: 24px;
  height: 24px;
  fill: currentColor;
}

/* Search & Filter Bar */
.filter-section {
  padding: 12px 16px;
  background-color: var(--primary-dark);
  flex-shrink: 0;
}

.search-box {
  position: relative;
  margin-bottom: 10px;
}

.search-box input {
  width: 100%;
  padding: 10px 16px 10px 40px;
  background-color: var(--accent);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 12px;
  color: var(--control);
  font-size: 0.95rem;
  outline: none;
}

.search-box input:focus {
  border-color: var(--highlight);
}

.search-box svg {
  position: absolute;
  left: 12px;
  top: 50%;
  transform: translateY(-50%);
  width: 20px;
  height: 20px;
  fill: var(--text-muted);
}

.categories {
  display: flex;
  overflow-x: auto;
  padding-bottom: 4px;
  scrollbar-width: none;
}

.categories::-webkit-scrollbar {
  display: none;
}

.cat-chip {
  background-color: var(--accent);
  color: var(--text-muted);
  border: none;
  padding: 6px 14px;
  border-radius: 20px;
  font-size: 0.85rem;
  white-space: nowrap;
  cursor: pointer;
  transition: all 0.2s;
  margin-left: 8px;
}

.cat-chip:last-child {
  margin-left: 0;
}

.cat-chip.active {
  background-color: var(--highlight);
  color: var(--control);
  font-weight: bold;
}

.cat-chip:active {
  opacity: 0.8;
}

/* Main Content List */
.library-content {
  flex: 1;
  overflow-y: auto;
  padding: 16px;
  display: flex;
  flex-direction: column;
}

.game-card {
  background-color: var(--card-bg);
  border-radius: 16px;
  padding: 12px;
  display: flex;
  align-items: center;
  border: 1px solid rgba(255,255,255,0.03);
  transition: transform 0.1s, background-color 0.2s;
  cursor: pointer;
  text-decoration: none;
  color: inherit;
  margin-bottom: 12px;
}

.game-card:last-child {
  margin-bottom: 0;
}

.game-card:active {
  transform: scale(0.98);
  background-color: var(--accent);
}

.game-icon {
  width: 64px;
  height: 64px;
  border-radius: 12px;
  object-fit: cover;
  flex-shrink: 0;
  background-color: var(--accent);
  margin-left: 12px;
}

.game-info {
  flex: 1;
  min-width: 0;
}

.game-title {
  font-size: 1rem;
  font-weight: bold;
  margin-bottom: 4px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.game-desc {
  font-size: 0.8rem;
  color: var(--text-muted);
  margin-bottom: 8px;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.game-meta {
  display: flex;
  font-size: 0.75rem;
  color: var(--text-muted);
}

.meta-item {
  display: flex;
  align-items: center;
  margin-left: 12px;
}

.meta-item:last-child {
  margin-left: 0;
}

.meta-item svg {
  width: 12px;
  height: 12px;
  fill: var(--highlight);
  margin-left: 4px;
}

/* States */
.state-message {
  text-align: center;
  padding: 40px 20px;
  color: var(--text-muted);
  font-size: 0.95rem;
}

.spinner {
  width: 40px;
  height: 40px;
  border: 3px solid rgba(255,255,255,0.1);
  border-top-color: var(--highlight);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
  margin: 0 auto 16px auto;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}
</style>
<style id="rt-native">html,body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}input,textarea,select,[contenteditable],.rt-selectable,.rt-selectable *{-webkit-user-select:text;user-select:text}img,a{-webkit-user-drag:none}a,button,[role=button]{outline:none}</style>
</head>
<body>

  <header class="app-header">
    <h1>مكتبة الألعاب</h1>
    <a href="home.html" class="back-btn" aria-label="الرئيسية">
      <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
    </a>
  </header>

  <div class="filter-section">
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="ابحث عن لعبة أو لغز...">
      <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
    </div>
    <div class="categories" id="categoryContainer">
      <button class="cat-chip active" data-category="الكل">الكل</button>
    </div>
  </div>

  <main class="library-content" id="libraryContent">
    <div class="state-message">
      <div class="spinner"></div>
      جاري تحميل الألغاز...
    </div>
  </main>

<script>
document.addEventListener("DOMContentLoaded", function() {
  var gamesData = [];
  var currentCategory = "الكل";
  var searchQuery = "";

  var libraryContent = document.getElementById("libraryContent");
  var searchInput = document.getElementById("searchInput");
  var categoryContainer = document.getElementById("categoryContainer");

  function playClickSound() {
    try {
      var audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      var osc = audioCtx.createOscillator();
      var gain = audioCtx.createGain();
      osc.type = "sine";
      osc.frequency.setValueAtTime(440, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.05);
      gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.05);
    } catch (e) {
      // Audio not allowed or unsupported
    }
  }

  function renderGames() {
    libraryContent.innerHTML = "";

    var filtered = gamesData.filter(function(game) {
      var matchesCategory = currentCategory === "الكل" || game.category === currentCategory;
      var matchesSearch = game.title.toLowerCase().indexOf(searchQuery.toLowerCase()) !== -1 ||
                          game.description.toLowerCase().indexOf(searchQuery.toLowerCase()) !== -1;
      return matchesCategory && matchesSearch;
    });

    if (filtered.length === 0) {
      libraryContent.innerHTML = '<div class="state-message rt-selectable">لم يتم العثور على ألعاب مطابقة لبحثك</div>';
      return;
    }

    var frag = document.createDocumentFragment();

    for (var i = 0; i < filtered.length; i++) {
      var game = filtered[i];
      var card = document.createElement("a");
      card.className = "game-card";
      card.href = "play.html?id=" + encodeURIComponent(game.id);
      
      card.addEventListener("click", function() {
        playClickSound();
      });

      var imgHtml = "";
      if (game.image) {
        imgHtml = '<img src="' + game.image + '" class="game-icon" alt="">';
      } else {
        imgHtml = '<div class="game-icon"></div>';
      }

      card.innerHTML = imgHtml +
        '<div class="game-info">' +
          '<div class="game-title rt-selectable">' + game.title + '</div>' +
          '<div class="game-desc rt-selectable">' + game.description + '</div>' +
          '<div class="game-meta">' +
            '<div class="meta-item">' +
              '<svg viewBox="0 0 24 24"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>' +
              game.rating +
            '</div>' +
            '<div class="meta-item">' +
              '<svg viewBox="0 0 24 24"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>' +
              game.plays +
            '</div>' +
          '</div>' +
        '</div>';

      frag.appendChild(card);
    }

    libraryContent.appendChild(frag);
  }

  function setupCategories() {
    var cats = ["الكل"];
    for (var i = 0; i < gamesData.length; i++) {
      if (cats.indexOf(gamesData[i].category) === -1) {
        cats.push(gamesData[i].category);
      }
    }

    categoryContainer.innerHTML = "";
    for (var j = 0; j < cats.length; j++) {
      var btn = document.createElement("button");
      btn.className = "cat-chip" + (cats[j] === currentCategory ? " active" : "");
      btn.textContent = cats[j];
      btn.setAttribute("data-category", cats[j]);
      
      btn.addEventListener("click", function() {
        playClickSound();
        var allChips = categoryContainer.querySelectorAll(".cat-chip");
        for (var k = 0; k < allChips.length; k++) {
          allChips[k].classList.remove("active");
        }
        this.classList.add("active");
        currentCategory = this.getAttribute("data-category");
        renderGames();
      });

      categoryContainer.appendChild(btn);
    }
  }

  searchInput.addEventListener("input", function(e) {
    searchQuery = e.target.value;
    renderGames();
  });

  fetch("games.json")
    .then(function(response) {
      return response.json();
    })
    .then(function(data) {
      gamesData = data;
      setupCategories();
      renderGames();
    })
    .catch(function(err) {
      libraryContent.innerHTML = '<div class="state-message rt-selectable">عذراً، تعذر تحميل الألعاب. يرجى المحاولة لاحقاً.</div>';
    });

});
</script>
</body>
</html>
