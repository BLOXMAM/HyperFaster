 f.y+=f.vy*dt;f.x=clamp(f.x+f.vx*dt,26,W-26);
 if(f.y>=GY){if(!f.onG&&f.vy>200){f.sq=.78;SFX.land();puff(f.x,GY,4,CREAM,80,6)}f.y=GY;f.vy=0;f.onG=true}else f.onG=false;
 f.sq+=(1-f.sq)*Math.min(1,dt*12);
 for(let i=f.trail.length-1;i>=0;i--){f.trail[i].l-=dt;if(f.trail[i].l<=0)f.trail.splice(i,1)}
 if(inp.shoot){f.shootT=.14;const a=vsAim(f,foe,inp);f.aimRel=f.face>0?a:Math.PI-a;
  if(f.sc<=0&&f.dash<=0){const wp=WP[V.cfg.wp]||WP.p,n0=PB.length;wp.fire({x:f.x+Math.cos(a)*30,y:f.y-38+Math.sin(a)*30},a);for(let i=n0;i<PB.length;i++)PB[i].own=f.i;f.sc=wp.cd;f.mf=.05;SFX.sh()}}
 f.look=clamp((foe.x-f.x)/300,-1,1)*1.6*f.face}

function aiInput(f,foe,dt){const A=f.ai,df=V.cfg.df,dx=foe.x-f.x,ad=Math.abs(dx);
 A.t-=dt;A.rt-=dt;A.jt-=dt;A.dn-=dt;A.sh-=dt;
 if(A.t<=0){A.t=rnd(.35,.9)*(1.25-df*.3);const want=df===2?330:df===1?390:440;
  A.dir=ad>want+70?Math.sign(dx):ad<want-90?-Math.sign(dx):[-1,0,1][(Math.random()*3)|0];
  if(f.x<90&&A.dir<0)A.dir=1;if(f.x>W-90&&A.dir>0)A.dir=-1}
 if(A.sh<=0){A.burst=!A.burst;A.sh=A.burst?rnd(.7,1.5):rnd(.3,.9)*(1.4-df*.4)}
 if(A.rt<=0){let thr=false;
  for(const q of PB)if(q.own===foe.i&&(q.x-f.x)*q.vx<0&&Math.abs(q.x-f.x)<210&&Math.abs(q.y-(f.y-30))<70){thr=true;break}
  if(!thr)for(const q of V.MB)if(q.team!==f.i&&(q.x-f.x)*q.vx<0&&Math.abs(q.x-f.x)<170&&Math.abs(q.y-(f.y-30))<60){thr=true;break}
  if(thr){A.rt=rnd(.25,.6)*(1.3-df*.35);const pr=[.3,.55,.85][df];if(Math.random()<pr){if(Math.random()<.5&&f.dcd<=0)A.dn=.1;else A.jt=.24}}
  else if(Math.random()<.012+df*.01){A.jt=.2}}
 return{mv:A.dir,jh:A.jt>0?1:0,dash:A.dn>0?1:0,shoot:A.burst&&ad<800&&(df>0||Math.abs(foe.y-f.y)<80)?1:0,up:0,face:dx>=0?1:-1,aimAt:df>=1,noise:rnd(-1,1)*(df===1?.16:.05)}}

function hitRect(f,x,y,r){const dh=f.dash>0,rx=f.x-14,ry=f.y-(dh?38:56),rw=28,rh=dh?28:52,nx=clamp(x,rx,rx+rw),ny=clamp(y,ry,ry+rh);return(x-nx)**2+(y-ny)**2<r*r}
function dmgF(f,amt,fromX){if(f.inv>0||f.dash>0||f.hp<=0||V.state!=='fight')return false;
 f.hp=Math.max(0,f.hp-amt);f.inv=.28;f.stun=0;f.flash=.15;f.vx=(f.x>=fromX?1:-1)*110;if(f.onG){f.vy=-150;f.onG=false}else f.vy=Math.min(f.vy,-60);V.hs=.05;V.shake=Math.max(V.shake,amt>9?9:5);
 SFX.hurt();stars(f.x,f.y-30,5,'#ff6a4a');popText(f.x,f.y-90,'-'+ar(amt),'#ffd23c');
 if(f.hp<=0)vsRoundEnd(1-f.i);return true}
function vsRoundEnd(w){V.state='rend';V.win=w;V.rounds[w]++;V.endT=0;V.ts=.35;V.MB.length=0;PB.length=0;SFX.ko();V.flash=.8;V.flashC='#fff';V.shake=18;V.p[1-w].inv=0}
function spawnMin(team,kind){V.M.push({team,kind,x:team?W+30:-30,y:GY,t:0,cd:rnd(.8,1.6),face:team?-1:1,hp:kind==='run'?3:2,mx:kind==='run'?3:2,flash:0,hit:0})}

function updateVS(rdt){let dt=Math.min(rdt,1/20);if(V.hs>0){V.hs-=dt;dt*=.06}dt*=V.ts;V.t+=dt;
 V.shake=Math.max(0,V.shake-dt*40);V.flash=Math.max(0,V.flash-dt*3);
 for(const m of V.motes){m.x+=(m.vx+Math.sin(V.t+m.ph)*8)*dt;m.y+=m.vy*dt;if(m.x<-10)m.x=W+10;if(m.x>W+10)m.x=-10;if(m.y<-10)m.y=GY;if(m.y>GY+6)m.y=-8}
 updPT(dt);const[a,b]=V.p;
 const live=V.state==='fight';
 if(V.state==='intro'){V.it+=dt;if(V.it>1.5){V.state='fight';AU.noise(.12,3000,1,.1,'highpass')}}
 const human=V.cfg.human,tl=human&&isTouch,tv=n=>({mv:(n.r?1:0)-(n.l?1:0),jh:n.jump?1:0,dash:n.dash?1:0,shoot:(n.shoot||n.fu)?1:0,up:n.fu?1:0});
 const i1=tl?tv(VT[0]):human?{mv:(KS.KeyD?1:0)-(KS.KeyA?1:0),jh:KS.KeyW?1:0,dash:KS.KeyS?1:0,shoot:KS.KeyF?1:0,up:KS.KeyG?1:0}
  :{mv:I.r-I.l,jh:I.jh,dash:I.dh,shoot:(I.shoot||I.fu)?1:0,up:(I.u||I.fu)?1:0};
 const i2=tl?tv(VT[1]):human?{mv:(KS.ArrowRight?1:0)-(KS.ArrowLeft?1:0),jh:KS.ArrowUp?1:0,dash:KS.ArrowDown?1:0,shoot:KS.KeyL?1:0,up:KS.KeyK?1:0}
  :(live?aiInput(b,a,dt):null);
 stepF(a,i1,dt,b,live);stepF(b,i2||{},dt,a,live);
 /* minions */
 if(live){for(let t=0;t<2;t++){if(!(t?V.cfg.him:V.cfg.me))continue;V.sp[t]-=dt;
   if(V.sp[t]<=0){V.sp[t]=7;const n=V.M.filter(m=>m.team===t).length;if(n<3){V.sk[t]^=1;spawnMin(t,V.sk[t]?'run':'shoot')}}}}
 for(let i=V.M.length-1;i>=0;i--){const m=V.M[i],foe=V.p[1-m.team];m.t+=dt;m.hit-=dt;m.flash=Math.max(0,m.flash-dt);
  const dx=foe.x-m.x,ad=Math.abs(dx);m.face=dx>=0?1:-1;
  if(V.state==='fight'){
   if(m.kind==='run'){m.x+=m.face*115*dt;if(ad<34&&foe.y>GY-70&&m.hit<=0&&dmgF(foe,10,m.x))m.hit=1}
   else{const want=ad>380?1:ad<250?-1:0;m.x+=m.face*want*90*dt;m.cd-=dt;
    if(m.cd<=0&&ad<760&&m.x>10&&m.x<W-10){m.cd=rnd(1.7,2.5);const a2=Math.atan2((foe.y-34)-(m.y-30),dx);V.MB.push({x:m.x+m.face*24,y:m.y-30,vx:Math.cos(a2)*270,vy:Math.sin(a2)*270,team:m.team,life:3,r:9});SFX.es()}}}
  if(m.hp<=0){puff(m.x,m.y-20,6,CREAM,160,8);stars(m.x,m.y-26,4,'#ffd23c');SFX.hit();V.M.splice(i,1)}}
 /* bullets */
 for(let i=PB.length-1;i>=0;i--){const q=PB[i];if(!q)continue;
  if(q.hm){const foe=V.p[1-q.own];steer(q,foe.x,foe.y-34,9,dt)}
  if(q.g)q.vy+=q.g*dt;q.x+=q.vx*dt;q.y+=q.vy*dt;q.life-=dt;
  if(q.bn>0&&q.y>GY-4&&q.vy>0){q.y=GY-4;q.vy=-q.vy*.88;q.bn--}
  let dead=q.life<=0||q.x<-30||q.x>W+30||q.y<-30||q.y>GY+10;
  if(!dead){const foe=V.p[1-q.own];
   if(foe.inv<=0&&foe.dash<=0&&hitRect(foe,q.x,q.y,q.r)&&V.state==='fight'){
    if(q.pr){q.hs=q.hs||[];if(!q.hs.includes(foe)){q.hs.push(foe);dmgF(foe,Math.round(q.dmg*7),q.x)}}
    else{dmgF(foe,Math.max(3,Math.round(q.dmg*7)),q.x);dead=true}}}
  if(!dead)for(const m of V.M){if(m.team===q.own)continue;const dx=(q.x-m.x)/(24+q.r),dy=(q.y-(m.y-26))/(26+q.r);
   if(dx*dx+dy*dy<1){if(q.pr){q.hs=q.hs||[];if(q.hs.includes(m))continue;q.hs.push(m)}m.hp-=q.dmg;m.flash=.08;SFX.hit();if(!q.pr)dead=true;break}}
  if(dead&&PB[i]===q){PB[i]=PB[PB.length-1];PB.pop()}}
 for(let i=V.MB.length-1;i>=0;i--){const q=V.MB[i];if(!q)continue;q.x+=q.vx*dt;q.y+=q.vy*dt;q.life-=dt;const foe=V.p[1-q.team];
  let dead=q.life<=0||q.x<-30||q.x>W+30||q.y<-30||q.y>GY+10;
  if(!dead&&foe.inv<=0&&foe.dash<=0&&hitRect(foe,q.x,q.y,q.r)&&dmgF(foe,8,q.x))dead=true;
  if(dead&&V.MB[i]===q){V.MB[i]=V.MB[V.MB.length-1];V.MB.pop()}}
 /* round flow */
 if(V.state==='rend'){V.endT+=rdt;if(V.endT>.9)V.ts=Math.min(1,V.ts+rdt*1.5);
  if(V.endT>2.4){if(V.rounds[V.win]>=2){V.state='over';V.ts=1;setPlaying(false);showVSResult()}else vsReset()}}}

function drawMin(g,m){const bob=Math.sin(m.t*10)*2,col=m.team?'#2f6fd0':'#d4452a';

 el(g,0,-26+bob,22,24,m.flash>0?'#fff':col,0,4);el(g,3,-20+bob,12,13,m.flash>0?'#fff':'rgba(255,244,214,.35)');
 el(g,8,-32+bob,6,8,'#fff7e0',0,3);el(g,10,-32+bob,3,4.5,INK);
 if(run){g.beginPath();g.moveTo(1,-43+bob);g.lineTo(16,-37+bob);g.lineWidth=4;g.stroke();g.beginPath();g.moveTo(10,-17+bob);g.lineTo(18,-14+bob);g.stroke()}
 else{el(g,26,-24+bob,13,5,'#5a4a3a',0,3.5);el(g,34,-24+bob,3,3,'#222')}

 if(m.hp<m.mx){g.fillStyle='#2a1c14';g.fillRect(m.x-18,m.y-62,36,6);g.fillStyle='#ff6a4a';g.fillRect(m.x-18,m.y-62,36*m.hp/m.mx,6);g.lineWidth=2.5;g.strokeStyle=INK;g.strokeRect(m.x-18,m.y-62,36,6)}}

  :'<p class="sub">لا توجد مشاهد بعد. كل مشهد تشاهده أثناء القصة يظهر هنا لتعيده متى شئت.</p>';
 return h+'<div class="row" style="margin-top:12px"><button class="btn" data-a="scenesback">رجوع</button></div></div>'}
let scFrom='title';
Object.assign(ACT,{
 scenes(){scFrom=scr==='opts'?'opts':'title';show(scenesHTML(),'scenes')},
 scenesback(){if(scFrom==='opts')show(optsHTML(),'opts');else toTitle()},
 scene(el){const id=+el.dataset.id;if(!csSeen(id))return;const was=$('stage').classList.contains('play');
  startCS(id,()=>{if(was)setPlaying(true);show(scenesHTML(),'scenes')})}});
</script></body></html>
