<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>اختبار الأداء</title><style>body{margin:0;background:#111;color:#eee;font:14px/1.6 sans-serif;padding:12px}button{font-size:16px;padding:10px 14px;margin:4px;border-radius:8px;border:0;background:#2f7d4a;color:#fff}pre{background:#000;padding:10px;border-radius:8px;white-space:pre-wrap;direction:ltr;text-align:left}canvas{display:block;width:100%;max-width:420px;background:#000;margin:8px 0}</style></head><body>
<h3>اختبار الأداء (Canvas 2D / WebGL)</h3>
<p>شغّله في كروم ثم في تطبيقك بنفس الجهاز وقارن الأرقام. كل اختبار 5 ثوانٍ.</p>
<button onclick="run2d(1)">Canvas 2D ×1</button><button onclick="run2d(2)">Canvas 2D ×2 دقة</button><button onclick="runGL()">WebGL</button>
<canvas id="c" width="800" height="800"></canvas><pre id="o"></pre>
<script>
const o=document.getElementById('o'),c=document.getElementById('c');
function log(t){o.textContent+=t+"\n"}
log("UA: "+navigator.userAgent);log("DPR: "+devicePixelRatio+"  screen: "+screen.width+"x"+screen.height);log("WebGPU: "+(!!navigator.gpu));
try{const g=document.createElement('canvas').getContext('webgl2')||document.createElement('canvas').getContext('webgl');if(g){const e=g.getExtension('WEBGL_debug_renderer_info');log("GL: "+(g instanceof WebGL2RenderingContext?'WebGL2':'WebGL1')+" | "+(e?g.getParameter(e.UNMASKED_RENDERER_WEBGL):g.getParameter(g.RENDERER)))}else log("GL: غير مدعوم")}catch(e){log("GL error "+e)}
function measure(draw,name){return new Promise(res=>{let n=0,t0=performance.now(),worst=0,last=t0;function f(t){draw(n);n++;worst=Math.max(worst,t-last);last=t;if(t-t0<5000)requestAnimationFrame(f);else{log(name+": "+(n/((t-t0)/1000)).toFixed(1)+" fps | أسوأ إطار "+worst.toFixed(0)+"ms");res()}}requestAnimationFrame(f)})}
async function run2d(k){c.width=c.height=400*k;const x=c.getContext('2d');await measure(n=>{x.fillStyle='#111';x.fillRect(0,0,c.width,c.height);for(let i=0;i<400;i++){x.fillStyle='hsl('+((i*7+n*3)%360)+',80%,55%)';x.beginPath();x.arc((i*53+n*4)%c.width,(i*97+n*2)%c.height,18*k,0,6.283);x.fill()}x.globalAlpha=.5;x.fillStyle='#fff';x.fillRect(n%c.width,0,40*k,c.height);x.globalAlpha=1},"Canvas2D ×"+k)}
async function runGL(){const cv=document.createElement('canvas');cv.width=cv.height=800;c.replaceWith(cv);cv.id='c';cv.style.cssText='display:block;width:100%;max-width:420px;margin:8px 0';const gl=cv.getContext('webgl');if(!gl){log("WebGL غير مدعوم");return}
const vs=gl.createShader(gl.VERTEX_SHADER);gl.shaderSource(vs,'attribute vec2 p;void main(){gl_Position=vec4(p,0,1);}');gl.compileShader(vs);
const fs=gl.createShader(gl.FRAGMENT_SHADER);gl.shaderSource(fs,'precision mediump float;uniform float t;void main(){vec2 u=gl_FragCoord.xy/800.;float v=0.;for(int i=0;i<60;i++){v+=sin(u.x*float(i)*3.+t)*cos(u.y*float(i)*2.+t*1.3);}gl_FragColor=vec4(.5+.5*sin(v),.5+.5*cos(v*1.3),.5+.5*sin(v*.7),1);}');gl.compileShader(fs);
const pr=gl.createProgram();gl.attachShader(pr,vs);gl.attachShader(pr,fs);gl.linkProgram(pr);gl.useProgram(pr);
const b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);const l=gl.getAttribLocation(pr,'p');gl.enableVertexAttribArray(l);gl.vertexAttribPointer(l,2,gl.FLOAT,false,0,0);const tu=gl.getUniformLocation(pr,'t');
await measure(n=>{gl.uniform1f(tu,n*.05);gl.drawArrays(gl.TRIANGLE_STRIP,0,4)},"WebGL (shader ثقيل)")}
</script></body></html>
