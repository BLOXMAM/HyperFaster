<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ساحة العمالقة</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <style>
body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#f5f6fa;font-family:'Cairo', 'Segoe UI', Tahoma, sans-serif;}
.sm-splash-title{font-size:1.4rem;color:#2c3e50;font-weight:bold;margin-bottom:14px;}
.sm-splash-dots span{display:inline-block;width:10px;height:10px;margin:0 3px;border-radius:50%;background:#00E5FF;animation:smBounce 1.2s infinite ease-in-out;}
.sm-splash-dots span:nth-child(2){animation-delay:0.15s;}
.sm-splash-dots span:nth-child(3){animation-delay:0.3s;}
@keyframes smBounce{0%,80%,100%{transform:scale(0.6);opacity:0.5;}40%{transform:scale(1);opacity:1;}}
.sm-splash-title.sm-anim-zoom{animation:smZoomInOut 0.8s cubic-bezier(.34,1.56,.64,1) both;}
@keyframes smZoomInOut{from{opacity:0;transform:scale(0.4);}to{opacity:1;transform:scale(1);}}
    </style>
</head>
<body>
<div class="sm-splash-title">ساحة العمالقة</div><div class="sm-splash-dots"><span></span><span></span><span></span></div>
<script>
    document.querySelectorAll(".sm-splash-title").forEach(function(el){ el.classList.add("sm-anim-zoom"); });
    setTimeout(function () { window.location.href = "home.html"; }, 2200);
</script>
</body>
</html>
