<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ساحة العمالقة</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;900&family=Lalezar&display=swap" rel="stylesheet">
<style>
/* --u هي وحدة القياس الوحيدة: تُحسب من أصغر بُعد مناسب للشاشة فيتكيّف التصميم مع أي مقاس أو اتجاه.
   أفقي: التصميم ١٠٠u × ٥٢٫٦u  |  عمودي: ٥٢٫٦u × ١٠٠u  (والزيادة في أي اتجاه تبقى فراغًا متوازنًا) */
:root{--ink:#1b1410;--cream:#fff4d6;--gold:#eab13c;--red:#d4452a;--theatre:#150f0b;--paper:#ecd9a8;
 --font-d:'Lalezar','Cairo',system-ui,sans-serif;--font-b:'Cairo',system-ui,sans-serif;--u:min(1vw,1.9vh)}
@media (orientation:portrait){:root{--u:min(1.9vw,1vh)}}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{height:100%;width:100%;overflow:hidden}
body{background:var(--theatre);color:var(--cream);font-family:var(--font-b);overflow:hidden;position:relative}
.bg{position:fixed;top:0;right:0;bottom:0;left:0;overflow:hidden}
.sky{position:absolute;top:0;right:0;bottom:0;left:0;background:linear-gradient(#bfe3a0 0%,#8fcf7a 55%,#5c9c4c 100%)}
.rays{position:absolute;top:-60%;right:-60%;bottom:-60%;left:-60%;opacity:.45;
 background:repeating-conic-gradient(from 0deg at 50% 62%,rgba(255,244,214,.55) 0 6deg,rgba(255,244,214,0) 6deg 14deg);animation:spin 90s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.ground{position:absolute;left:0;right:0;bottom:0;height:calc(var(--u)*12.6);background:linear-gradient(#4b7f3c,#2f5427);border-top:calc(var(--u)*.7) solid var(--ink)}
.tree{position:absolute;bottom:calc(var(--u)*12.2);width:calc(var(--u)*13);animation:sway 4s ease-in-out infinite;transform-origin:50% 100%}
.tree b{display:block;margin:0 auto;width:18%;height:calc(var(--u)*17);background:#7a6a2e;border:calc(var(--u)*.5) solid var(--ink)}
.tree i{display:block;width:100%;height:calc(var(--u)*13);border-radius:50%;background:#7cc468;border:calc(var(--u)*.7) solid var(--ink);margin-bottom:calc(var(--u)*-3)}
@keyframes sway{50%{transform:rotate(1.6deg)}}
/* المحتوى يتوسّط المساحة فوق منطقة الأبطال والشريط (محجوزة بالأسفل) */
.stage{position:absolute;top:0;right:0;bottom:0;left:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
 padding:env(safe-area-inset-top,0px) max(2vw,env(safe-area-inset-right,0px)) calc(var(--u)*16.5) max(2vw,env(safe-area-inset-left,0px))}
.title{font-family:var(--font-d);font-weight:400;font-size:calc(var(--u)*12.5);line-height:1.1;color:var(--red);
 -webkit-text-stroke:calc(var(--u)*.55) var(--ink);paint-order:stroke fill;text-shadow:calc(var(--u)*.7) calc(var(--u)*.9) 0 var(--ink),calc(var(--u)*1.4) calc(var(--u)*1.8) 0 var(--gold);
 animation:drop .9s cubic-bezier(.3,1.6,.5,1) both;transform-origin:50% 100%;max-width:96vw}
.title span{display:inline}
@keyframes drop{0%{transform:translateY(-120%) rotate(-6deg);opacity:0}100%{transform:none;opacity:1}}
.sub{font-weight:900;font-size:max(11px,calc(var(--u)*2.9));color:var(--cream);-webkit-text-stroke:calc(var(--u)*.3) var(--ink);paint-order:stroke fill;margin-top:calc(var(--u)*1);animation:fade .8s .9s both;max-width:92vw}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.kings{display:flex;gap:calc(var(--u)*.8);justify-content:center;flex-wrap:nowrap;direction:rtl;margin-top:calc(var(--u)*2.2);max-width:96vw}
.kg{width:min(calc(var(--u)*7.1),7.6vw);background:var(--cream);border:calc(var(--u)*.45) solid var(--ink);border-radius:calc(var(--u)*1);padding:calc(var(--u)*.6);text-align:center;animation:pop .5s both;box-shadow:calc(var(--u)*.35) calc(var(--u)*.45) 0 var(--ink)}
.kp{position:relative;height:calc(var(--u)*6);display:flex;align-items:center;justify-content:center}
.kp img{max-width:100%;max-height:100%;display:block}
.kp .q{position:absolute;top:0;right:0;bottom:0;left:0;display:flex;align-items:center;justify-content:center;font-family:var(--font-d);font-size:calc(var(--u)*4.6);color:#fff4d6;text-shadow:0 0 calc(var(--u)*.5) #000}
.kg.x .kp:before,.kg.x .kp:after{content:"";position:absolute;left:10%;right:10%;top:50%;height:calc(var(--u)*1);margin-top:calc(var(--u)*-.5);background:var(--red);border:calc(var(--u)*.25) solid var(--ink);border-radius:99px;transform:rotate(45deg)}
.kg.x .kp:after{transform:rotate(-45deg)}
.kg small{display:block;margin-top:calc(var(--u)*.3);font-weight:900;font-size:max(8px,calc(var(--u)*1.45));color:var(--ink);white-space:nowrap;overflow:hidden}
@keyframes pop{from{opacity:0;transform:translateY(calc(var(--u)*2)) scale(.8)}to{opacity:1;transform:none}}
.hero2,.bro2{position:absolute;display:block;filter:drop-shadow(0 calc(var(--u)*.5) 0 rgba(0,0,0,.28))}
.hero2{bottom:calc(var(--u)*3.6);right:max(2.5%,env(safe-area-inset-right,0px));height:calc(var(--u)*11.5);animation:hero 1s .5s both,bob 1.6s 1.5s ease-in-out infinite}
.bro2{bottom:calc(var(--u)*3.6);left:max(2.5%,env(safe-area-inset-left,0px));height:calc(var(--u)*8);animation:hero 1s .8s both,hop 1.1s 1.8s ease-in-out infinite}
@keyframes hero{from{transform:translateX(60vw);opacity:0}to{transform:none;opacity:1}}
@keyframes bob{50%{transform:translateY(calc(var(--u)*-.8))}}
@keyframes hop{0%,100%{transform:translateY(0)}40%{transform:translateY(calc(var(--u)*-2.4))}}
.bar{position:absolute;bottom:calc(var(--u)*3.6);left:0;right:0;margin:0 auto;width:min(48vw,calc(var(--u)*46));height:calc(var(--u)*1.7);background:var(--ink);border:calc(var(--u)*.4) solid var(--ink);border-radius:99px;overflow:hidden;animation:fade .6s 1.4s both}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#eab13c,#ffd23c);animation:load 2.6s 1.5s ease-out forwards}
@keyframes load{to{width:100%}}
.hint{position:absolute;bottom:calc(var(--u)*.9);left:0;right:0;text-align:center;font-weight:900;font-size:max(10px,calc(var(--u)*1.7));color:var(--cream);opacity:.85;animation:fade .6s 1.6s both}
.vig{position:absolute;top:0;right:0;bottom:0;left:0;pointer-events:none;background:radial-gradient(ellipse at center,rgba(20,10,0,0) 52%,rgba(20,10,0,.62) 100%)}
.scan{position:absolute;top:0;right:0;bottom:0;left:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.03) 0 1px,rgba(0,0,0,0) 1px 3px)}

/* ===== شاشات عمودية (جوال/تابلت بالطول): العنوان على سطرين والملوك شبكة ٤×٣ ===== */
@media (orientation:portrait){
 .title{font-size:calc(var(--u)*11.5)}
 .title span{display:block}
 .sub{font-size:max(11px,calc(var(--u)*2.7));margin-top:calc(var(--u)*1.6)}
 .kings{display:grid;grid-template-columns:repeat(4,calc(var(--u)*11.4));gap:calc(var(--u)*1.1);margin-top:calc(var(--u)*3);max-width:100vw}
 .kg{width:auto;padding:calc(var(--u)*.7)}
 .kp{height:calc(var(--u)*8.2)}
 .kp .q{font-size:calc(var(--u)*6.4)}
 .kg small{font-size:max(9px,calc(var(--u)*2.1));margin-top:calc(var(--u)*.4)}
 .stage{padding-bottom:calc(var(--u)*18)}
 .ground{height:calc(var(--u)*15)}
 .tree{bottom:calc(var(--u)*14.6);width:calc(var(--u)*7.5)}
 .tree b{height:calc(var(--u)*4.5)}
 .tree i{height:calc(var(--u)*7.5);margin-bottom:calc(var(--u)*-1.6)}
 .hero2{height:calc(var(--u)*13);bottom:calc(var(--u)*4)}
 .bro2{height:calc(var(--u)*9);bottom:calc(var(--u)*4)}
 .bar{bottom:calc(var(--u)*4.6);width:min(40vw,calc(var(--u)*24));height:calc(var(--u)*1.9)}
 .hint{bottom:calc(var(--u)*1.6);font-size:max(11px,calc(var(--u)*2.1))}
}
/* شاشات عريضة جدًا (طي/سينمائية): نبقي كل شيء في المنتصف بدل التمدد */
@media (min-aspect-ratio:21/9){.stage{padding-bottom:calc(var(--u)*17)}}
/* شاشات قصيرة جدًا أفقيًا: نخفي سطر التلميح ونصغّر العنوان قليلًا ليبقى كل شيء ظاهرًا */
@media (orientation:landscape) and (max-height:330px){.hint{display:none}.title{font-size:calc(var(--u)*11)}}
@media (prefers-reduced-motion:reduce){.rays,.tree{animation:none}}
</style>
</head>
<body>
<div class="bg"><div class="sky"></div><div class="rays"></div></div>
<div class="tree" style="right:3%"><i></i><b></b></div>
<div class="tree" style="left:2%;animation-delay:-1.4s"><i></i><b></b></div>
<div class="ground"></div>
<div class="stage">
 <h1 class="title"><span>ساحة</span> <span>العمالقة</span></h1>
 <p class="sub">اكشف الملوك الاثني عشر بهزيمتهم</p>
 <div class="kings" id="kings"></div>
</div>
